<button class="fixed bottom-4 right-4 z-[55] h-12 pl-4 pr-5 rounded-full bg-ink text-white shadow-lg flex items-center gap-2 text-sm font-semibold hover:bg-ink/90" @click="demoOpen = !demoOpen" :aria-expanded="demoOpen">
  <span x-html="ic(demoOpen ? 'x' : 'play','w-4 h-4')"></span><span>Demo</span><span class="text-white/60 font-normal hidden sm:inline" x-text="'· ' + roleName()"></span>
</button>
<div x-show="demoOpen" x-transition.opacity.duration.150ms class="fixed z-[56] bottom-20 right-4 left-4 sm:left-auto sm:w-[380px] max-h-[75vh] overflow-y-auto rounded-2xl bg-white border border-line shadow-[0_20px_60px_rgba(40,30,10,.25)] p-4 space-y-5" @click.outside="if (!$event.target.closest('button[aria-expanded]')) demoOpen = false">
  <div><p class="text-xs font-semibold uppercase tracking-wide text-ink2 mb-2">Lihat sebagai</p>
    <div class="grid grid-cols-2 gap-1.5"><template x-for="r in ['pengunjung','admin','bendahara','kepala']"><button class="btn btn-sm" :class="role === r ? 'btn-p' : 'btn-o'" @click="setRole(r); demoOpen = false" x-text="roleName(r)"></button></template></div></div>
  <div><p class="text-xs font-semibold uppercase tracking-wide text-ink2 mb-2">Skenario demo</p>
    <div class="space-y-1.5"><template x-for="s in SCENARIOS" :key="s.no">
      <div class="rounded-xl border border-line">
        <button class="w-full flex items-center gap-3 px-3 py-2.5 text-left" @click="demoSc = demoSc === s.no ? 0 : s.no">
          <span class="w-6 h-6 rounded-full bg-psoft text-pink grid place-items-center text-xs font-bold shrink-0" x-text="s.no"></span><span class="text-sm font-semibold flex-1" x-text="s.judul"></span>
          <span class="text-ink2 transition-transform" :class="demoSc === s.no && 'rotate-180'" x-html="ic('chevronDown','w-4 h-4')"></span></button>
        <div x-show="demoSc === s.no" class="px-3 pb-3">
          <ol class="text-[13px] text-ink2 space-y-1 list-decimal pl-5"><template x-for="l in s.langkah"><li x-text="l"></li></template></ol>
          <button class="btn btn-p btn-sm w-full mt-3" @click="runScenario(s)"><span x-html="ic('play','w-3.5 h-3.5')"></span>Mulai skenario</button></div>
      </div></template></div></div>
  <div><p class="text-xs font-semibold uppercase tracking-wide text-ink2 mb-2">Palet warna</p>
    <div class="grid grid-cols-3 gap-1.5"><template x-for="(p, k) in PALETTES" :key="k"><button class="rounded-xl border-2 p-2 text-left" :class="palette === k ? 'border-ink' : 'border-line'" @click="palette = k">
      <span class="flex gap-1"><template x-for="c in [p.primary, p.psoft, p.accent, p.bg]"><i class="w-4 h-4 rounded-full border border-black/5" :style="'background:rgb(' + c + ')'"></i></template></span>
      <span class="block text-[11px] font-semibold mt-1.5 leading-tight" x-text="p.nama"></span></button></template></div></div>
  <div><p class="text-xs font-semibold uppercase tracking-wide text-ink2 mb-2">Waktu simulasi</p>
    <div class="flex flex-wrap gap-1.5"><button class="btn btn-o btn-sm" @click="warp(1)">+1 jam</button><button class="btn btn-o btn-sm" @click="warp(24)">+1 hari</button><button class="btn btn-g btn-sm" x-show="offset" @click="offset = 0; now = Date.now(); save(); toast('Waktu kembali normal', 'clock', 'info')">Normal</button></div>
    <p class="text-xs text-ink2 mt-1.5">Majukan jam untuk melihat hold kedaluwarsa otomatis.</p></div>
  <button class="btn btn-g btn-sm w-full" @click="resetDemo(); demoOpen = false"><span x-html="ic('refresh','w-4 h-4')"></span>Reset data demo</button>
</div>

<!-- ===================== TEMPLATE BERSAMA (disisipkan lewat x-html) ===================== -->

<!-- Wizard pemesanan: dipakai P4 (penyewa) dan A6 (booking offline admin) -->
<template id="tpl-wizard">
<div class="grid lg:grid-cols-[1fr_320px] gap-6 lg:gap-10 items-start">
  <div class="min-w-0">
    <ol class="flex items-center gap-1.5 sm:gap-3 mb-6" aria-label="Langkah pemesanan">
      <template x-for="(s, k) in ['Fasilitas & jadwal', 'Layanan tambahan', 'Penanggung jawab', 'Ringkasan & bayar']" :key="k">
        <li class="flex items-center gap-2 min-w-0" :class="k < 3 && 'flex-1'">
          <button type="button" class="flex items-center gap-2 min-w-0" :disabled="k + 1 > wiz.step" @click="wiz.step = k + 1">
            <span class="w-8 h-8 shrink-0 rounded-full grid place-items-center text-sm font-semibold border transition-colors"
              :class="wiz.step === k + 1 ? 'bg-primary text-white border-primary' : wiz.step > k + 1 ? 'bg-psoft text-pink border-psoft' : 'border-line text-ink2 bg-white'">
              <span x-show="wiz.step <= k + 1" x-text="k + 1"></span><span x-show="wiz.step > k + 1" x-html="ic('check','w-4 h-4')"></span></span>
            <span class="text-sm font-medium truncate" :class="wiz.step === k + 1 ? 'text-ink' : 'text-ink2 hidden sm:inline'" x-text="s"></span>
          </button>
          <span x-show="k < 3" class="flex-1 h-px bg-line min-w-[12px]"></span>
        </li>
      </template>
    </ol>

    <!-- langkah 1 -->
    <div x-show="wiz.step === 1" class="space-y-4">
      <template x-if="!wiz.items.length">
        <div class="rounded-2xl border border-dashed border-line p-6 text-center">
          <p class="font-semibold">Belum ada fasilitas di pesanan ini</p>
          <p class="text-sm text-ink2 mt-1">Tambahkan kamar, aula, atau ruangan di bawah. Satu pesanan boleh berisi beberapa fasilitas.</p>
          <a x-show="wiz.mode==='online'" href="#/p2" class="btn btn-o btn-sm mt-4">Lihat katalog fasilitas</a>
        </div>
      </template>
      <template x-for="(it, idx) in wiz.items" :key="idx + it.fac + (it.start || it.date) + (it.end || it.from)">
        <div class="card p-4 flex gap-4" :class="wizErr(idx) && 'border-[#E5A5A5]'">
          <span class="w-11 h-11 rounded-xl grid place-items-center shrink-0" :class="isKamar(it) ? 'bg-asoft text-accent' : 'bg-psoft text-pink'" x-html="ic(isKamar(it) ? 'bed' : 'building')"></span>
          <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-3">
              <p class="font-semibold" x-text="fac(it.fac).nama"></p>
              <p class="font-semibold tnum whitespace-nowrap" x-text="rp(itemAmount(it))"></p>
            </div>
            <p class="text-sm text-ink2" x-text="itemDesc(it)"></p>
            <p x-show="fac(it.fac).verifikasi" class="text-xs text-pink mt-1">Perlu verifikasi admin</p>
            <p class="err" x-show="wizErr(idx)"><span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="wizErr(idx)"></span></p>
          </div>
          <button type="button" class="btn btn-g w-10 h-10 px-0 shrink-0" @click="wiz.items.splice(idx, 1)" :aria-label="'Hapus ' + fac(it.fac).nama"><span x-html="ic('trash','w-[18px] h-[18px]')"></span></button>
        </div>
      </template>
      <p class="err" x-show="wiz.errors.items"><span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="wiz.errors.items"></span></p>

      <div class="rounded-2xl bg-s2/60 p-4 md:p-5">
        <p class="font-semibold mb-3">Tambah fasilitas</p>
        <div class="grid gap-3 md:grid-cols-2">
          <label class="md:col-span-2"><span class="lbl">Fasilitas</span>
            <select class="inp" x-model="wiz.add.fac" @change="wiz.add.err = ''">
              <optgroup label="Kamar asrama"><template x-for="f in kamarFacs()"><option :value="f.id" x-text="f.nama + ' — ' + rp(f.tarif) + '/malam'" :selected="wiz.add.fac === f.id"></option></template></optgroup>
              <optgroup label="Gedung & ruangan"><template x-for="f in gedungFacs()"><option :value="f.id" x-text="f.nama + ' — ' + rp(f.tarif) + '/hari'" :selected="wiz.add.fac === f.id"></option></template></optgroup>
            </select></label>
          <template x-if="fac(wiz.add.fac).jenis === 'kamar'"><div class="contents">
            <label><span class="lbl">Masuk</span><input type="date" class="inp" x-model="wiz.add.start" :min="todayIso"></label>
            <label><span class="lbl">Keluar</span><input type="date" class="inp" x-model="wiz.add.end" :min="wiz.add.start"></label>
            <label><span class="lbl">Jumlah kamar <span class="text-ink2 font-normal" x-text="'(sisa ' + minAvail(wiz.add.fac, wiz.add.start, wiz.add.end) + ')'"></span></span><input type="number" min="1" class="inp tnum" x-model.number="wiz.add.qty"></label>
          </div></template>
          <template x-if="fac(wiz.add.fac).jenis === 'gedung'"><div class="contents">
            <label><span class="lbl">Tanggal</span><input type="date" class="inp" x-model="wiz.add.date" :min="todayIso"></label>
            <div><span class="lbl">Sesi</span><div class="flex flex-wrap gap-2">
              <template x-for="s in db.settings.aturan.sesi"><button type="button" class="btn btn-o btn-sm" @click="wiz.add.from = s.dari; wiz.add.to = s.sampai" x-text="s.nama"></button></template>
              <button type="button" class="btn btn-o btn-sm" @click="wiz.add.from='08:00'; wiz.add.to='16:00'">08.00–16.00</button></div></div>
            <label><span class="lbl">Mulai</span><input type="time" step="1800" class="inp" x-model="wiz.add.from"></label>
            <label><span class="lbl">Selesai</span><input type="time" step="1800" class="inp" x-model="wiz.add.to"></label>
          </div></template>
        </div>
        <p class="err" x-show="wiz.add.err"><span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="wiz.add.err"></span></p>
        <button type="button" class="btn btn-o mt-4" @click="addFromWiz()"><span x-html="ic('plus','w-[18px] h-[18px]')"></span>Tambahkan</button>
      </div>
    </div>

    <!-- langkah 2 -->
    <div x-show="wiz.step === 2">
      <p class="text-ink2 mb-4">Opsional. Jumlah hari otomatis mengikuti lama pemesanan, bisa diubah.</p>
      <div class="card divide-y divide-line">
        <template x-for="a in db.addons.filter(x => x.aktif)" :key="a.id">
          <div class="p-4 flex flex-wrap items-center gap-3" x-init="wiz.addons[a.id] ??= { qty: 0, hari: addonDays(wizBooking()) }">
            <div class="flex-1 min-w-[180px]">
              <p class="font-semibold" x-text="a.nama"></p>
              <p class="text-sm text-ink2"><span class="tnum" x-text="rp(a.tarif)"></span> / <span x-text="a.satuan"></span><span x-show="a.asumsi" class="tag ml-2">tarif asumsi</span></p>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" class="btn btn-o w-10 h-10 px-0" @click="wiz.addons[a.id].qty = Math.max(0, wiz.addons[a.id].qty - 1)" :aria-label="'Kurangi ' + a.nama"><span x-html="ic('minus','w-4 h-4')"></span></button>
              <span class="w-8 text-center font-semibold tnum" x-text="wiz.addons[a.id].qty"></span>
              <button type="button" class="btn btn-o w-10 h-10 px-0" @click="wiz.addons[a.id].qty++" :aria-label="'Tambah ' + a.nama"><span x-html="ic('plus','w-4 h-4')"></span></button>
            </div>
            <label class="flex items-center gap-2 text-sm text-ink2" x-show="wiz.addons[a.id].qty > 0">× <input type="number" min="1" class="inp inp-sm w-16 tnum" x-model.number="wiz.addons[a.id].hari"><span x-text="a.satuan === 'malam' ? 'malam' : 'hari'"></span></label>
          </div>
        </template>
      </div>
    </div>

    <!-- langkah 3 -->
    <div x-show="wiz.step === 3" class="grid gap-4 md:grid-cols-2">
      <div class="md:col-span-2 flex items-center justify-between gap-3"><p class="text-ink2">Data penanggung jawab pemesanan. Data tamu lain tidak diperlukan.</p>
        <button type="button" class="btn btn-g btn-sm shrink-0" @click="fillDemo()"><span x-html="ic('sparkle','w-4 h-4')"></span>Isi contoh</button></div>
      <label><span class="lbl">Nama lengkap *</span><input class="inp" x-model="wiz.pj.nama" autocomplete="name"><span class="err" x-show="wiz.errors.nama" x-text="wiz.errors.nama"></span></label>
      <label><span class="lbl">Nomor HP / WhatsApp *</span><input class="inp" type="tel" inputmode="tel" x-model="wiz.pj.hp" placeholder="0812xxxxxxxx" autocomplete="tel"><span class="err" x-show="wiz.errors.hp" x-text="wiz.errors.hp"></span></label>
      <label><span class="lbl">Email <span class="text-ink2 font-normal">(untuk invoice)</span></span><input class="inp" type="email" x-model="wiz.pj.email" autocomplete="email"><span class="err" x-show="wiz.errors.email" x-text="wiz.errors.email"></span></label>
      <label><span class="lbl">Instansi <span class="text-ink2 font-normal">(opsional)</span></span><input class="inp" x-model="wiz.pj.instansi" placeholder="Kosongkan bila perorangan"></label>
      <label class="md:col-span-2"><span class="lbl">Keperluan / nama kegiatan *</span><input class="inp" x-model="wiz.pj.kegiatan" placeholder="Contoh: Pelatihan kader kesehatan"><span class="err" x-show="wiz.errors.kegiatan" x-text="wiz.errors.kegiatan"></span></label>
      <label x-show="wiz.items.some(i => !isKamar(i))"><span class="lbl">Perkiraan jumlah peserta</span><input type="number" min="1" class="inp tnum" x-model="wiz.pj.peserta"></label>
    </div>

    <!-- langkah 4 -->
    <div x-show="wiz.step === 4" class="space-y-5">
      <div class="card p-4 md:p-5">
        <p class="font-semibold mb-2">Penanggung jawab</p>
        <p class="text-sm" x-text="wiz.pj.nama + ' · ' + wiz.pj.hp + (wiz.pj.email ? ' · ' + wiz.pj.email : '')"></p>
        <p class="text-sm text-ink2" x-text="wiz.pj.kegiatan + (wiz.pj.instansi ? ' · ' + wiz.pj.instansi : '')"></p>
      </div>
      <div>
        <p class="font-semibold mb-2">Cara bayar</p>
        <div class="grid sm:grid-cols-2 gap-3">
          <template x-for="o in [['dp', 'DP ' + db.settings.bayar.dpPersen + '% dulu', rp(dpAmount(wizBooking())) + ' sekarang, sisanya paling lambat H-' + db.settings.bayar.pelunasanH], ['lunas', 'Bayar lunas', rp(total(wizBooking())) + ' sekali bayar']]">
            <label class="card p-4 flex gap-3 cursor-pointer transition-colors" :class="wiz.bayar === o[0] && 'border-primary ring-1 ring-primary bg-psoft/30'">
              <input type="radio" class="mt-1 accent-[rgb(var(--primary))]" :value="o[0]" x-model="wiz.bayar">
              <span><span class="block font-semibold" x-text="o[1]"></span><span class="block text-sm text-ink2 tnum" x-text="o[2]"></span></span>
            </label>
          </template>
        </div>
      </div>
      <div x-show="wiz.mode === 'offline'">
        <p class="font-semibold mb-2">Metode (booking offline)</p>
        <div class="seg max-w-md"><button type="button" :class="wiz.metode==='transfer' && 'on'" @click="wiz.metode='transfer'">Transfer nanti</button><button type="button" :class="wiz.metode==='tunai' && 'on'" @click="wiz.metode='tunai'" :disabled="!db.settings.bayar.tunai">Tunai di tempat</button></div>
        <p class="hint" x-text="wiz.metode==='tunai' ? 'Pembayaran tunai dicatat sekarang dan kuitansi langsung terbit. Booking langsung terkonfirmasi.' : 'Tagihan dikirim ke WA/email penyewa; jadwal ditahan sesuai batas hold.'"></p>
      </div>
      <div class="rounded-2xl bg-bg border border-line p-4 text-sm space-y-1.5">
        <p class="flex gap-2"><span class="text-ink2 shrink-0" x-html="ic('info','w-4 h-4 mt-0.5')"></span><span>Uang jaminan <b x-text="rp(db.settings.bayar.jaminan)"></b> dibayar saat check-in dan dikembalikan saat check-out.</span></p>
        <p class="flex gap-2" x-show="wiz.items.some(i => !isKamar(i))"><span class="text-ink2 shrink-0" x-html="ic('info','w-4 h-4 mt-0.5')"></span><span>Pesanan ini berisi gedung/ruangan, jadi <b>diverifikasi admin dulu</b> sebelum tagihan terbit.</span></p>
        <p class="flex gap-2"><span class="text-ink2 shrink-0" x-html="ic('info','w-4 h-4 mt-0.5')"></span><span>Pembatalan kamar paling lambat H-1 dana kembali 100%; gedung paling lambat H-14 kembali 100%. <a href="#/p8" target="_blank" class="text-primary font-semibold">Aturan lengkap</a></span></p>
      </div>
      <label x-show="wiz.mode === 'online'" class="flex gap-3 items-start cursor-pointer"><input type="checkbox" class="mt-1 w-5 h-5 accent-[rgb(var(--primary))]" x-model="wiz.setuju">
        <span>Saya menyetujui <a href="#/p8" target="_blank" class="text-primary font-semibold">syarat & ketentuan</a> serta kebijakan pembatalan.</span></label>
      <p class="err" x-show="wiz.errors.setuju || wiz.errors.items"><span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="wiz.errors.setuju || wiz.errors.items"></span></p>
    </div>

    <div class="mt-8 flex items-center justify-between gap-3">
      <button type="button" class="btn btn-o" x-show="wiz.step > 1" @click="wiz.step--"><span x-html="ic('back','w-4 h-4')"></span>Kembali</button>
      <span x-show="wiz.step === 1"></span>
      <button type="button" class="btn btn-p min-w-[160px]" @click="wizNext()" x-text="wiz.step < 4 ? 'Lanjut' : (wiz.mode === 'offline' ? 'Simpan booking offline' : (wiz.items.some(i => !isKamar(i)) ? 'Kirim pengajuan' : 'Pesan sekarang'))"></button>
    </div>
  </div>

  <aside class="card p-5 lg:sticky lg:top-24">
    <p class="font-semibold">Ringkasan biaya</p>
    <template x-if="!wiz.items.length"><p class="text-sm text-ink2 mt-2">Belum ada item.</p></template>
    <ul class="mt-3 space-y-2 text-sm">
      <template x-for="l in lines(wizBooking())"><li class="flex justify-between gap-3"><span class="text-ink2 min-w-0" x-text="l.label"></span><span class="tnum whitespace-nowrap" x-text="rp(l.amount)"></span></li></template>
    </ul>
    <div class="mt-4 pt-4 border-t border-line flex justify-between items-baseline"><span class="font-semibold">Total</span><span class="text-xl font-semibold tnum" x-text="rp(total(wizBooking()))"></span></div>
    <p class="text-sm text-ink2 mt-1 flex justify-between" x-show="wiz.items.length"><span>DP <span x-text="db.settings.bayar.dpPersen"></span>%</span><span class="tnum" x-text="rp(dpAmount(wizBooking()))"></span></p>
  </aside>
</div>
</template>

<!-- Rincian biaya (P7 & A4) -->
<template id="tpl-lines">
<div class="card overflow-hidden">
  <p class="px-5 pt-4 pb-2 font-semibold">Rincian pesanan</p>
  <ul class="divide-y divide-line">
    <template x-for="(l, k) in lines(b)" :key="k">
      <li class="px-5 py-3 flex justify-between gap-4"><div class="min-w-0"><p class="font-medium" x-text="l.label"></p><p class="text-sm text-ink2" x-text="l.desc"></p>
        <template x-if="b.items[k] && (b.kamarDibagi || {})[k] && b.kamarDibagi[k].length"><p class="mt-1 flex flex-wrap gap-1"><template x-for="no in b.kamarDibagi[k]"><span class="tag bg-[#E3E9F7] text-[#33508F]" x-text="'Kamar ' + no"></span></template></p></template></div>
        <span class="font-semibold tnum whitespace-nowrap" x-text="rp(l.amount)"></span></li>
    </template>
  </ul>
  <div class="px-5 py-3 bg-s2/50 flex justify-between font-semibold"><span>Total</span><span class="tnum" x-text="rp(total(b))"></span></div>
</div>
</template>

<!-- Tagihan & riwayat pembayaran (P7 & A4) -->
<template id="tpl-pay">
<div class="card p-5">
  <p class="font-semibold">Tagihan</p>
  <dl class="mt-3 text-sm space-y-1.5">
    <div class="flex justify-between"><dt class="text-ink2">Total</dt><dd class="tnum" x-text="rp(total(b))"></dd></div>
    <div class="flex justify-between"><dt class="text-ink2">Sudah dibayar</dt><dd class="tnum" x-text="rp(paid(b))"></dd></div>
    <div class="flex justify-between font-semibold text-base pt-1.5 border-t border-line"><dt>Sisa</dt><dd class="tnum" :class="sisa(b) > 0 && 'text-pink'" x-text="rp(sisa(b))"></dd></div>
    <p x-show="sisa(b) > 0 && paid(b) > 0 && b.status==='Terkonfirmasi'" class="text-xs text-ink2" x-text="'Pelunasan paling lambat ' + tglPanjang(dueDate(b))"></p>
    <template x-if="b.jaminan"><div class="flex justify-between text-ink2 pt-1"><dt>Uang jaminan</dt><dd class="tnum" x-text="rp(b.jaminan.nominal) + (b.jaminan.status === 'ditahan' ? ' (ditahan)' : ' (kembali ' + rp(b.jaminan.kembali) + ')')"></dd></div></template>
  </dl>
  <template x-if="b.payments.length">
    <ul class="mt-4 space-y-2">
      <template x-for="p in b.payments" :key="p.id">
        <li class="rounded-xl bg-bg p-3 text-sm">
          <div class="flex justify-between gap-2"><span class="font-medium" x-text="p.jenis + ' · ' + (p.metode || 'Transfer')"></span><span class="tnum font-semibold" x-text="rp(p.nominal)"></span></div>
          <div class="flex justify-between gap-2 mt-1 items-center">
            <span class="text-xs text-ink2" x-text="waktu(p.tgl)"></span>
            <span class="badge" :style="st({menunggu: 'Menunggu Verifikasi Bayar', diterima: 'Terkonfirmasi', ditolak: 'Ditolak'}[p.status])" x-text="{menunggu: 'Diperiksa', diterima: 'Diterima', ditolak: 'Ditolak'}[p.status]"></span>
          </div>
          <p x-show="p.alasan" class="text-xs text-[#9B2C2C] mt-1" x-text="'Alasan: ' + p.alasan"></p>
          <button x-show="p.kuitansi" class="text-xs font-semibold text-primary mt-1.5 inline-flex items-center gap-1" @click="open('doc', {jenis: 'kuitansi', kode: b.kode, pid: p.id})"><span x-html="ic('download','w-3.5 h-3.5')"></span><span x-text="'Kuitansi ' + p.kuitansi"></span></button>
        </li>
      </template>
    </ul>
  </template>
  <button class="btn btn-o btn-sm w-full mt-4" @click="open('doc', {jenis: 'invoice', kode: b.kode})"><span x-html="ic('file','w-4 h-4')"></span>Lihat invoice</button>
</div>
</template>

<!-- Linimasa status (P7 & A4) -->
<template id="tpl-log">
<div class="card p-5">
  <p class="font-semibold">Linimasa</p>
  <ol class="mt-4 flex items-center gap-1 overflow-x-auto pb-1">
    <template x-for="(s, k) in progress(b)" :key="k">
      <li class="flex items-center gap-1 shrink-0">
        <span class="flex items-center gap-1.5 text-xs font-semibold rounded-full px-2.5 py-1" :class="s.cur ? '' : s.done ? 'bg-asoft text-accent' : 'bg-s2 text-ink2'" :style="s.cur ? st(b.status) : ''">
          <span x-show="s.done && !s.cur" x-html="ic('check','w-3.5 h-3.5')"></span><span x-text="s.label"></span></span>
        <span x-show="k < progress(b).length - 1" class="w-4 h-px bg-line"></span>
      </li>
    </template>
  </ol>
  <ul class="mt-5 space-y-3 border-l border-line ml-1.5">
    <template x-for="(l, k) in b.log.slice().reverse()" :key="k">
      <li class="pl-4 relative"><span class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full border-2 border-white" :class="k === 0 ? 'bg-primary' : 'bg-line'"></span>
        <p class="text-sm" x-text="l.teks"></p><p class="text-xs text-ink2" x-text="waktu(l.t)"></p></li>
    </template>
  </ul>
</div>
</template>

<!-- Isi detail booking penyewa (P7) -->
<template id="tpl-detail">
<div class="mt-6 grid lg:grid-cols-[1fr_340px] gap-6 items-start">
  <div class="space-y-6 min-w-0">
    <!-- langkah berikutnya -->
    <div class="rounded-2xl p-5" :style="st(b.status)">
      <template x-if="b.status==='Menunggu Pembayaran'"><div class="flex flex-wrap items-center gap-4 justify-between">
        <div><p class="font-semibold">Selesaikan pembayaran sebelum hold habis</p><p class="text-sm opacity-90" x-text="'Jadwal ditahan sampai ' + waktu(b.holdUntil) + '. Lewat dari itu pesanan kedaluwarsa otomatis.'"></p></div>
        <p class="text-3xl font-semibold tnum" x-text="countdown(b.holdUntil)"></p></div></template>
      <template x-if="b.status==='Menunggu Verifikasi'"><div><p class="font-semibold">Menunggu verifikasi admin</p><p class="text-sm opacity-90">Admin memeriksa jadwal dan keperluan gedung. Jadwal ditahan <span class="tnum font-semibold" x-text="sisaWaktu(b.holdUntil)"></span> lagi.</p></div></template>
      <template x-if="b.status==='Perlu Revisi'"><div x-data="{ teks: '' }"><p class="font-semibold">Admin meminta revisi</p><p class="text-sm mt-1" x-text="b.revisi"></p>
        <textarea class="inp mt-3 bg-white" x-model="teks" placeholder="Tuliskan perbaikan atau keterangan tambahan"></textarea>
        <button class="btn btn-p btn-sm mt-3" @click="submitRevision(b, teks)">Kirim revisi</button></div></template>
      <template x-if="b.status==='Menunggu Verifikasi Bayar'"><div><p class="font-semibold">Bukti bayar sedang diperiksa bendahara</p><p class="text-sm opacity-90">Anda akan menerima notifikasi WhatsApp/email setelah pembayaran diverifikasi.</p></div></template>
      <template x-if="b.status==='Terkonfirmasi'"><div><p class="font-semibold" x-text="sisa(b) > 0 ? 'Terkonfirmasi dengan DP' : 'Terkonfirmasi dan lunas'"></p>
        <p class="text-sm opacity-90" x-text="sisa(b) > 0 ? 'Sisa ' + rp(sisa(b)) + ' dilunasi paling lambat ' + tglPanjang(dueDate(b)) + '.' : 'Tunjukkan kode booking saat check-in, ' + tglPanjang(firstDate(b)) + ' mulai pukul ' + jamLabel(db.settings.aturan.checkin) + '. Nomor kamar dibagikan petugas.'"></p></div></template>
      <template x-if="b.status==='Berlangsung'"><div><p class="font-semibold">Sedang berlangsung</p>
        <p class="text-sm opacity-90" x-text="'Check-out ' + waktu(checkoutDue(b)) + '.' + (sisa(b) > 0 ? ' Ada tagihan tambahan ' + rp(sisa(b)) + '.' : '')"></p></div></template>
      <template x-if="b.status==='Selesai'"><div><p class="font-semibold">Selesai. Terima kasih telah menggunakan fasilitas Bapelkes.</p><p class="text-sm opacity-90" x-show="b.jaminan" x-text="'Uang jaminan dikembalikan ' + rp((b.jaminan||{}).kembali) + '.'"></p></div></template>
      <template x-if="b.status==='Ditolak'"><div><p class="font-semibold">Pengajuan ditolak</p><p class="text-sm" x-text="b.alasanTolak"></p></div></template>
      <template x-if="b.status==='Kedaluwarsa'"><div class="flex flex-wrap items-center justify-between gap-3"><div><p class="font-semibold">Pesanan kedaluwarsa</p><p class="text-sm">Batas waktu pembayaran habis dan jadwal sudah dilepas. Silakan pesan ulang.</p></div><a href="#/p2" class="btn btn-o btn-sm">Pesan ulang</a></div></template>
      <template x-if="b.status==='Dibatalkan'"><div><p class="font-semibold">Booking dibatalkan</p><p class="text-sm" x-text="b.refund ? 'Refund ' + rp(b.refund.nominal) + (b.refund.status === 'ditransfer' ? ' sudah ditransfer.' : ' sedang diproses bendahara.') : 'Tidak ada dana yang dikembalikan.'"></p></div></template>
    </div>
    <template x-if="b.reschedule && b.reschedule.status === 'diajukan'"><div class="rounded-2xl border border-line bg-white p-4 text-sm flex gap-3"><span class="text-ink2" x-html="ic('calendar')"></span><span x-text="'Pengajuan pindah jadwal ke ' + tglPanjang(b.reschedule.baru) + ' sedang ditinjau admin.'"></span></div></template>
    <div x-html="document.getElementById('tpl-lines').innerHTML"></div>
    <div x-html="document.getElementById('tpl-log').innerHTML"></div>
  </div>
  <aside class="space-y-4 lg:sticky lg:top-24">
    <div class="card p-5 grid gap-2">
      <button class="btn btn-p w-full" x-show="canUpload(b)" @click="openUpload(b)"><span x-html="ic('upload','w-[18px] h-[18px]')"></span><span x-text="paid(b) ? 'Unggah bukti pelunasan' : 'Unggah bukti bayar'"></span></button>
      <button class="btn btn-o w-full" x-show="canExtend(b)" @click="openExtend(b)"><span x-html="ic('plus','w-[18px] h-[18px]')"></span>Perpanjang</button>
      <button class="btn btn-o w-full" x-show="canResched(b)" @click="openResched(b)"><span x-html="ic('calendar','w-[18px] h-[18px]')"></span>Ajukan reschedule</button>
      <button class="btn btn-d w-full" x-show="canCancel(b)" @click="open('cancel', {kode: b.kode, alasan: ''})"><span x-html="ic('x','w-[18px] h-[18px]')"></span>Batalkan</button>
      <p x-show="!canUpload(b) && !canExtend(b) && !canResched(b) && !canCancel(b)" class="text-sm text-ink2 text-center">Tidak ada aksi untuk status ini.</p>
    </div>
    <div x-html="document.getElementById('tpl-pay').innerHTML"></div>
    <div class="card p-5 text-sm" x-show="['Menunggu Pembayaran','Terkonfirmasi','Berlangsung'].includes(b.status) && sisa(b) > 0">
      <p class="font-semibold">Rekening tujuan</p>
      <p class="mt-2 font-semibold text-base" x-text="db.settings.bayar.bank + ' · ' + db.settings.bayar.noRek"></p><p class="text-ink2" x-text="'a.n. ' + db.settings.bayar.atasNama"></p>
      <button class="text-primary font-semibold text-xs mt-2 inline-flex items-center gap-1" @click="copy(db.settings.bayar.noRek)"><span x-html="ic('copy','w-3.5 h-3.5')"></span>Salin nomor rekening</button>
    </div>
  </aside>
</div>
</template>
</body>
</html>
