<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BAPELKES Palangka Raya · Sewa Kamar & Gedung (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: Object.fromEntries(['bg','s2','line','ink','ink2','primary','psoft','pink','accent','asoft'].map(k => [k, `rgb(var(--${k}) / <alpha-value>)`])),
    fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'], serif: ['Fraunces', 'Georgia', 'serif'] },
  } } };
</script>
<style type="text/tailwindcss">
  :root { --bg: 250 247 240; --s2: 243 238 227; --line: 230 223 208; --ink: 43 42 38; --ink2: 94 90 80; --primary: 138 106 47; --psoft: 241 230 204; --pink: 92 69 25; --accent: 63 107 79; --asoft: 227 238 229; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { background: rgb(var(--bg)); color: rgb(var(--ink)); }
  ::selection { background: rgb(var(--psoft)); color: rgb(var(--pink)); }
  [x-cloak] { display: none !important; }
  * { scrollbar-width: thin; scrollbar-color: rgb(var(--line)) transparent; }
  :focus-visible { outline: 2px solid rgb(var(--primary)); outline-offset: 2px; border-radius: 8px; }
  .tnum { font-variant-numeric: tabular-nums; }
  @layer components {
    .btn { @apply inline-flex items-center justify-center gap-2 h-11 px-4 rounded-[10px] text-[15px] font-semibold transition-colors duration-150 whitespace-nowrap disabled:opacity-45 disabled:cursor-not-allowed cursor-pointer select-none; }
    .btn-sm { @apply h-9 px-3 text-sm; }
    .btn-p { @apply bg-primary text-white hover:bg-pink; }
    .btn-a { @apply bg-accent text-white hover:opacity-90; }
    .btn-o { @apply border border-line bg-white text-ink hover:bg-s2; }
    .btn-g { @apply text-ink2 hover:bg-s2 hover:text-ink; }
    .btn-d { @apply border border-[#EDC9C9] bg-white text-[#9B2C2C] hover:bg-[#F8E1E1]; }
    .inp { @apply h-11 w-full rounded-[10px] border border-line bg-white px-3 text-[15px] text-ink placeholder:text-ink2/60 focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition; }
    .inp-sm { @apply h-9 text-sm; }
    textarea.inp { @apply h-auto py-2.5 min-h-[88px]; }
    .lbl { @apply block text-sm font-medium text-ink mb-1.5; }
    .hint { @apply text-[13px] text-ink2 mt-1; }
    .err { @apply text-[13px] text-[#9B2C2C] mt-1.5 flex gap-1.5 items-start; }
    .card { @apply bg-white border border-line rounded-2xl shadow-[0_1px_2px_rgba(60,50,30,.04)]; }
    .badge { @apply inline-flex items-center gap-1.5 rounded-full px-2.5 py-0.5 text-xs font-semibold whitespace-nowrap; }
    .dot { @apply inline-block w-1.5 h-1.5 rounded-full shrink-0; }
    .tag { @apply inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-xs font-medium bg-s2 text-ink2; }
    .tbl { @apply w-full text-sm; }
    .tbl th { @apply text-left font-semibold text-ink2 text-xs uppercase tracking-wide px-4 py-2.5 bg-s2/60 border-b border-line whitespace-nowrap; }
    .tbl td { @apply px-4 py-3 border-b border-line/70 align-top; }
    .tbl tr:last-child td { @apply border-b-0; }
    .tbl tbody tr { @apply hover:bg-bg/70; }
    .navlink { @apply px-3 py-2 rounded-lg text-[15px] font-medium text-ink2 hover:text-ink hover:bg-s2 transition-colors; }
    .side { @apply flex items-center gap-3 w-full px-3 py-2 rounded-lg text-sm font-medium text-ink2 hover:bg-white hover:text-ink transition-colors; }
    .side-on { @apply bg-white text-ink shadow-[0_1px_2px_rgba(60,50,30,.06)]; }
    .seg { @apply flex p-1 rounded-xl bg-s2 gap-1; }
    .seg > button { @apply flex-1 h-9 px-3 whitespace-nowrap rounded-lg text-sm font-semibold text-ink2 transition-colors; }
    .seg > button.on { @apply bg-white text-ink shadow-[0_1px_2px_rgba(60,50,30,.08)]; }
    .h-display { @apply font-serif font-medium tracking-[-0.01em] text-ink; }
    .photo { @apply relative overflow-hidden bg-gradient-to-br from-psoft via-s2 to-asoft; }
  }
  .hatch { background-image: repeating-linear-gradient(135deg, rgba(62,58,69,.18) 0 6px, transparent 6px 12px); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; scroll-behavior: auto !important; } }
</style>
<script src="data.js"></script>
<script src="app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-cloak class="font-sans antialiased text-[15px] leading-relaxed min-h-screen">

<!-- Ornamen batang garing (pohon kehidupan Dayak), dipakai ulang lewat <use> -->
<svg width="0" height="0" class="absolute" aria-hidden="true">
  <symbol id="garing" viewBox="0 0 120 220" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
    <path d="M60 196V26"/><path d="M60 12l-7 14h14z"/><path d="M52 26h16"/>
    <path d="M60 50c-8-6-20-4-24 4-3 6 2 11 7 8"/><path d="M60 50c8-6 20-4 24 4 3 6-2 11-7 8"/>
    <path d="M60 80c-11-7-27-5-32 5-3 8 3 13 9 9"/><path d="M60 80c11-7 27-5 32 5 3 8-3 13-9 9"/>
    <path d="M60 112c-14-8-34-6-40 6-4 9 4 15 11 10"/><path d="M60 112c14-8 34-6 40 6 4 9-4 15-11 10"/>
    <path d="M60 146c-16-9-40-7-47 7-4 10 5 17 13 11"/><path d="M60 146c16-9 40-7 47 7 4 10-5 17-13 11"/>
    <path d="M42 196h36l-6-16H48z"/><path d="M36 204h48"/>
  </symbol>
</svg>

<!-- ===================== SITUS PUBLIK ===================== -->
<template x-if="!isPanel() && route !== 'masuk'">
<div class="min-h-screen flex flex-col">
  <header class="sticky top-0 z-30 bg-bg/90 backdrop-blur border-b border-line">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
      <a href="#/p1" class="flex items-center gap-3 min-w-0">
        <img x-show="logoOk" src="assets/logo-bapelkes.png" @error="logoOk = false" alt="Logo Bapelkes" class="h-11 w-11 object-contain">
        <span x-show="!logoOk" class="h-10 w-10 rounded-full grid place-items-center bg-primary text-white font-serif text-xl" title="Placeholder logo">B</span>
        <span class="leading-tight min-w-0"><span class="flex items-center gap-2 font-semibold tracking-wide">BAPELKES<span class="tag py-0 text-[10px] uppercase tracking-wide bg-psoft text-pink" title="Tampilan contoh, bukan situs resmi">Prototype</span></span><span class="block text-xs text-ink2 truncate">Palangka Raya · Kalimantan Tengah</span></span>
      </a>
      <nav class="hidden md:flex items-center gap-1 ml-auto" aria-label="Navigasi utama">
        <a href="#/p1" class="navlink" :class="route==='p1' && 'text-ink bg-s2'">Beranda</a>
        <a href="#/p2" class="navlink" :class="['p2','p3'].includes(route) && 'text-ink bg-s2'">Fasilitas</a>
        <a href="#/p6" class="navlink" :class="['p6','p7'].includes(route) && 'text-ink bg-s2'">Lacak Booking</a>
        <a href="#/p8" class="navlink" :class="route==='p8' && 'text-ink bg-s2'">Info</a>
      </nav>
      <a href="#/p4" class="btn btn-p ml-auto md:ml-2">
        <span x-html="ic('clipboard','w-[18px] h-[18px]')"></span><span class="hidden sm:inline">Pesanan</span>
        <span x-show="wiz.mode==='online' && wiz.items.length" class="bg-white/25 rounded-full px-1.5 text-xs tnum" x-text="wiz.items.length"></span>
      </a>
      <button class="md:hidden btn btn-g w-11 px-0" @click="navOpen = !navOpen" :aria-expanded="navOpen" aria-label="Buka menu"><span x-html="ic(navOpen ? 'x' : 'menu')"></span></button>
    </div>
    <nav x-show="navOpen" x-transition.opacity.duration.150ms class="md:hidden border-t border-line bg-bg px-4 py-2 grid">
      <a href="#/p1" class="navlink py-3">Beranda</a><a href="#/p2" class="navlink py-3">Fasilitas</a><a href="#/p6" class="navlink py-3">Lacak Booking</a><a href="#/p8" class="navlink py-3">Info & Kontak</a>
    </nav>
  </header>

  <main class="flex-1">

  <!-- P1 BERANDA -->
  <template x-if="route==='p1'">
  <div>
    <section class="max-w-6xl mx-auto px-4 pt-6 md:pt-10">
      <div class="photo rounded-3xl min-h-[380px] md:min-h-[460px] flex flex-col justify-end p-6 md:p-12 md:pb-24">
        <svg class="absolute right-[-30px] md:right-12 top-6 h-[90%] text-primary/25" aria-hidden="true"><use href="#garing"/></svg>
        <span class="absolute top-4 left-4 tag bg-white/70">Foto gedung Bapelkes menyusul</span>
        <div class="relative max-w-xl">
          <h1 class="h-display text-[34px] leading-[1.1] md:text-[52px]">Menginap dan berkegiatan di Bapelkes Palangka Raya</h1>
          <p class="mt-4 text-ink2 text-base md:text-lg max-w-md">Kamar asrama, aula, dan ruang kelas milik Pemerintah Provinsi Kalimantan Tengah. Tarif resmi, pesan tanpa membuat akun.</p>
        </div>
      </div>
      <!-- form cek ketersediaan -->
      <form @submit.prevent="p2tab = q.jenis; go('/p2')" class="card relative mt-4 md:-mt-12 md:mx-8 p-4 md:p-5 grid gap-3 md:grid-cols-[auto_1fr_1fr_auto_auto] md:items-end">
        <div>
          <span class="lbl">Jenis</span>
          <div class="seg md:w-[290px]" role="group" aria-label="Jenis fasilitas">
            <button type="button" :class="q.jenis==='kamar' && 'on'" @click="q.jenis='kamar'">Kamar</button>
            <button type="button" :class="q.jenis==='gedung' && 'on'" @click="q.jenis='gedung'">Gedung & Ruangan</button>
          </div>
        </div>
        <template x-if="q.jenis==='kamar'"><label><span class="lbl">Tanggal masuk</span><input type="date" class="inp" x-model="q.start" :min="todayIso"></label></template>
        <template x-if="q.jenis==='kamar'"><label><span class="lbl">Tanggal keluar</span><input type="date" class="inp" x-model="q.end" :min="q.start"></label></template>
        <template x-if="q.jenis==='gedung'"><label class="md:col-span-2"><span class="lbl">Tanggal kegiatan</span><input type="date" class="inp" x-model="q.date" :min="todayIso"></label></template>
        <label><span class="lbl" x-text="q.jenis==='kamar' ? 'Kamar' : 'Peserta'"></span>
          <input type="number" min="1" class="inp md:w-24 tnum" :value="q.jenis==='kamar' ? q.qty : q.peserta" @input="q.jenis==='kamar' ? q.qty=+$event.target.value : q.peserta=+$event.target.value"></label>
        <button class="btn btn-p md:w-auto"><span x-html="ic('search','w-[18px] h-[18px]')"></span>Cek ketersediaan</button>
      </form>
    </section>

    <section class="max-w-6xl mx-auto px-4 mt-16 md:mt-20">
      <div class="flex items-end justify-between gap-4 mb-6">
        <h2 class="h-display text-2xl md:text-3xl">Fasilitas</h2>
        <a href="#/p2" class="text-sm font-semibold text-primary hover:text-pink inline-flex items-center gap-1">Lihat semua <span x-html="ic('chevron','w-4 h-4')"></span></a>
      </div>
      <div class="flex md:grid md:grid-cols-3 gap-4 overflow-x-auto snap-x pb-2 -mx-4 px-4 md:mx-0 md:px-0">
        <template x-for="f in [fac('dbl'), fac('twn'), fac('aula')]" :key="f.id">
          <a :href="'#/p3/' + f.id" class="group snap-start shrink-0 w-[78%] sm:w-[46%] md:w-auto">
            <div class="photo aspect-[4/3] rounded-2xl"><span class="absolute bottom-3 left-3 tag bg-white/80">Foto menyusul</span>
              <span class="absolute inset-0 grid place-items-center text-primary/40" x-html="ic(f.jenis==='kamar' ? 'bed' : 'building','w-12 h-12')"></span></div>
            <div class="pt-3">
              <div class="flex items-start justify-between gap-3"><h3 class="font-semibold text-[17px] group-hover:text-primary transition-colors" x-text="f.nama"></h3></div>
              <p class="text-sm text-ink2 mt-0.5" x-text="f.jenis==='kamar' ? `${unitsOf(f.id)} kamar · ${f.kapasitas} orang/kamar` : `Hingga ${f.kapasitas} orang`"></p>
              <p class="mt-2"><span class="font-semibold tnum" x-text="rp(f.tarif)"></span><span class="text-sm text-ink2" x-text="' / ' + f.satuan"></span></p>
            </div>
          </a>
        </template>
      </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 mt-16 md:mt-24">
      <h2 class="h-display text-2xl md:text-3xl mb-8">Cara memesan</h2>
      <ol class="grid sm:grid-cols-2 lg:grid-cols-4 gap-x-8 gap-y-8">
        <template x-for="(s, k) in [
          ['Pilih fasilitas & jadwal', 'Ketersediaan terlihat langsung. Satu pesanan boleh berisi kamar dan aula sekaligus.'],
          ['Isi data penanggung jawab', 'Cukup nama, nomor HP, dan email. Tanpa akun dan tanpa surat permohonan.'],
          ['Transfer & unggah bukti', 'Bayar lunas atau DP ke rekening resmi BLUD, lalu unggah bukti lewat Lacak Booking.'],
          ['Datang & check-in', 'Tunjukkan kode booking. Petugas membagikan nomor kamar saat Anda tiba.']]" :key="k">
          <li class="relative pl-12">
            <span class="absolute left-0 top-0 w-9 h-9 rounded-full border border-primary/40 text-primary grid place-items-center font-serif text-lg" x-text="k+1"></span>
            <h3 class="font-semibold" x-text="s[0]"></h3><p class="text-sm text-ink2 mt-1" x-text="s[1]"></p>
          </li>
        </template>
      </ol>
      <div class="mt-10 grid md:grid-cols-2 gap-4">
        <div class="rounded-2xl bg-asoft/70 p-5 flex gap-4"><span class="text-accent shrink-0" x-html="ic('bed','w-6 h-6')"></span>
          <p class="text-sm"><b class="font-semibold">Kamar langsung terkonfirmasi</b> bila tersedia. Jadwal ditahan <span x-text="db.settings.aturan.holdKamarJam"></span> jam sampai Anda mengunggah bukti bayar.</p></div>
        <div class="rounded-2xl bg-psoft/70 p-5 flex gap-4"><span class="text-pink shrink-0" x-html="ic('building','w-6 h-6')"></span>
          <p class="text-sm"><b class="font-semibold">Gedung dan ruangan diverifikasi admin</b> dulu. Setelah disetujui, tagihan terbit dan jadwal ditahan <span x-text="db.settings.aturan.holdGedungJam"></span> jam.</p></div>
      </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 mt-16 md:mt-24 mb-16">
      <div class="rounded-3xl border border-line bg-white p-6 md:p-10 grid md:grid-cols-[1.2fr_1fr] gap-8 items-center">
        <div>
          <h2 class="h-display text-2xl md:text-3xl">Sudah memesan?</h2>
          <p class="text-ink2 mt-2">Cek status, unggah bukti bayar, perpanjang, atau unduh kuitansi dengan kode booking dan nomor HP Anda.</p>
          <div class="mt-5 flex flex-wrap gap-3"><a href="#/p6" class="btn btn-p">Lacak booking</a>
            <a :href="'https://wa.me/62' + db.settings.profil.wa.replace(/\D/g,'').slice(1)" target="_blank" rel="noopener" class="btn btn-o"><span x-html="ic('chat','w-[18px] h-[18px]')"></span>Tanya admin via WhatsApp</a></div>
        </div>
        <dl class="grid grid-cols-2 gap-4 text-sm">
          <div class="rounded-xl bg-bg p-4"><dt class="text-ink2">Check-in</dt><dd class="font-semibold text-lg tnum" x-text="jamLabel(db.settings.aturan.checkin)"></dd></div>
          <div class="rounded-xl bg-bg p-4"><dt class="text-ink2">Check-out</dt><dd class="font-semibold text-lg tnum" x-text="jamLabel(db.settings.aturan.checkout)"></dd></div>
          <div class="rounded-xl bg-bg p-4"><dt class="text-ink2">Gedung buka</dt><dd class="font-semibold text-lg tnum" x-text="jamLabel(db.settings.aturan.buka) + '–' + jamLabel(db.settings.aturan.tutup)"></dd></div>
          <div class="rounded-xl bg-bg p-4"><dt class="text-ink2">Dasar tarif</dt><dd class="font-semibold">Pergub Kalteng 63/2024</dd></div>
        </dl>
      </div>
    </section>
  </div>
  </template>

  <!-- P2 KATALOG -->
  <template x-if="route==='p2'">
  <section class="max-w-6xl mx-auto px-4 py-8 md:py-12">
    <h1 class="h-display text-3xl md:text-4xl">Fasilitas</h1>
    <p class="text-ink2 mt-2 max-w-2xl">Tarif mengikuti Pergub Kalteng No. 63 Tahun 2024. Ketersediaan di bawah dihitung untuk tanggal yang Anda pilih.</p>
    <div class="mt-6 flex flex-col md:flex-row md:items-end gap-4">
      <div class="seg md:w-[300px]" role="tablist">
        <button :class="p2tab==='kamar' && 'on'" @click="p2tab='kamar'" role="tab" :aria-selected="p2tab==='kamar'">Kamar</button>
        <button :class="p2tab==='gedung' && 'on'" @click="p2tab='gedung'" role="tab" :aria-selected="p2tab==='gedung'">Gedung & Ruangan</button>
      </div>
      <div class="flex gap-3 md:ml-auto" x-show="p2tab==='kamar'">
        <label class="flex-1"><span class="lbl">Masuk</span><input type="date" class="inp" x-model="q.start" :min="todayIso"></label>
        <label class="flex-1"><span class="lbl">Keluar</span><input type="date" class="inp" x-model="q.end" :min="q.start"></label>
      </div>
      <label class="md:ml-auto" x-show="p2tab==='gedung'"><span class="lbl">Tanggal kegiatan</span><input type="date" class="inp" x-model="q.date" :min="todayIso"></label>
    </div>
    <div class="mt-8 grid sm:grid-cols-2 lg:grid-cols-3 gap-x-5 gap-y-8">
      <template x-for="f in (p2tab==='kamar' ? kamarFacs() : gedungFacs())" :key="f.id">
        <article class="group">
          <a :href="'#/p3/' + f.id" class="block photo aspect-[4/3] rounded-2xl">
            <span class="absolute inset-0 grid place-items-center text-primary/35" x-html="ic(f.jenis==='kamar' ? 'bed' : 'building','w-12 h-12')"></span>
            <span class="absolute bottom-3 left-3 tag bg-white/80">Foto menyusul</span>
            <span x-show="f.verifikasi" class="absolute top-3 left-3 tag bg-white/90 text-pink"><span x-html="ic('info','w-3.5 h-3.5')"></span>Perlu verifikasi admin</span>
          </a>
          <div class="pt-3">
            <h2 class="font-semibold text-[17px]"><a :href="'#/p3/' + f.id" class="hover:text-primary" x-text="f.nama"></a></h2>
            <p class="text-sm text-ink2 mt-0.5 flex items-center gap-1.5"><span x-html="ic('people','w-4 h-4')"></span><span x-text="f.jenis==='kamar' ? f.kapasitas + ' orang/kamar' : 'Hingga ' + f.kapasitas + ' orang'"></span><span>·</span><span x-text="f.lokasi"></span></p>
            <div class="mt-3 flex items-end justify-between gap-3">
              <p><span class="font-semibold text-lg tnum" x-text="rp(f.tarif)"></span><span class="text-sm text-ink2" x-text="' / ' + f.satuan"></span>
                <template x-if="f.tarifJam"><span class="block text-xs text-ink2" x-text="'atau ' + rp(f.tarifJam) + ' / jam'"></span></template></p>
              <template x-if="f.jenis==='kamar'">
                <span class="badge" :style="minAvail(f.id, q.start, q.end) ? st('Terkonfirmasi') : st('Ditolak')" x-text="minAvail(f.id, q.start, q.end) ? 'Sisa ' + minAvail(f.id, q.start, q.end) + ' kamar' : 'Penuh'"></span>
              </template>
              <template x-if="f.jenis==='gedung'">
                <span class="badge" :style="{kosong: st('Terkonfirmasi'), sebagian: st('Menunggu Pembayaran'), penuh: st('Ditolak')}[dayState(f.id, q.date)]"
                  x-text="{kosong: 'Kosong seharian', sebagian: 'Sebagian terisi', penuh: 'Penuh'}[dayState(f.id, q.date)]"></span>
              </template>
            </div>
          </div>
        </article>
      </template>
    </div>
  </section>
  </template>

  <!-- P3 DETAIL FASILITAS -->
  <template x-for="f in (route==='p3' && fac(param).id ? [fac(param)] : [])" :key="f.id">
  <section class="max-w-6xl mx-auto px-4 py-6 md:py-10">
    <a href="#/p2" class="inline-flex items-center gap-1 text-sm text-ink2 hover:text-ink"><span x-html="ic('back','w-4 h-4')"></span>Semua fasilitas</a>
    <div class="mt-3 flex flex-wrap items-center gap-3"><h1 class="h-display text-3xl md:text-4xl" x-text="f.nama"></h1>
      <span x-show="f.verifikasi" class="tag text-pink bg-psoft">Perlu verifikasi admin</span></div>
    <p class="text-ink2 mt-1" x-text="f.lokasi + ' · ' + (f.jenis==='kamar' ? f.kapasitas + ' orang/kamar · ' + unitsOf(f.id) + ' kamar' : 'kapasitas ' + f.kapasitas + ' orang')"></p>
    <div class="mt-5 grid grid-cols-4 grid-rows-2 gap-2 md:gap-3 h-[220px] md:h-[360px]">
      <div class="photo col-span-4 md:col-span-2 row-span-2 rounded-2xl"><span class="absolute inset-0 grid place-items-center text-primary/30" x-html="ic(f.jenis==='kamar' ? 'bed' : 'building','w-16 h-16')"></span><span class="absolute bottom-3 left-3 tag bg-white/80">Foto utama menyusul</span></div>
      <template x-for="k in 4"><div class="photo hidden md:block rounded-2xl" :class="k===2 && 'rounded-tr-2xl'"><span class="absolute bottom-2 left-2 tag bg-white/70 text-[11px]" x-text="'Foto ' + (k+1)"></span></div></template>
    </div>

    <div class="mt-8 grid lg:grid-cols-[1fr_380px] gap-8 lg:gap-12 items-start">
      <div class="space-y-10 min-w-0">
        <div><p class="text-base" x-text="f.deskripsi"></p>
          <ul class="mt-4 grid grid-cols-2 sm:grid-cols-3 gap-y-2 gap-x-4 text-sm">
            <template x-for="x in f.fasilitas"><li class="flex items-center gap-2"><span class="text-accent" x-html="ic('check','w-4 h-4')"></span><span x-text="x"></span></li></template>
          </ul></div>

        <!-- kalender ketersediaan -->
        <div>
          <h2 class="font-semibold text-lg">Ketersediaan</h2>
          <template x-if="f.jenis==='kamar'">
            <div class="mt-3">
              <p class="text-sm text-ink2">Sisa unit per malam. Ketuk tanggal untuk memilih tanggal masuk.</p>
              <div class="mt-3 grid grid-cols-7 gap-1.5 text-center">
                <template x-for="h in ['Sen','Sel','Rab','Kam','Jum','Sab','Min']"><div class="text-xs font-semibold text-ink2 py-1" x-text="h"></div></template>
                <template x-for="d in p3Cells()" :key="d">
                  <button type="button"
                    :disabled="d < todayIso" @click="p3.start = d; if (p3.end <= d) p3.end = addDays(d, 1)"
                    class="rounded-lg py-1.5 text-sm border transition-colors disabled:opacity-35 disabled:cursor-default"
                    :class="d >= p3.start && d < p3.end ? 'border-primary ring-1 ring-primary' : 'border-transparent'"
                    :style="d < todayIso ? '' : roomAvail(f.id, d) === 0 ? st('Ditolak') : roomAvail(f.id, d) < 5 ? st('Menunggu Pembayaran') : st('Terkonfirmasi')">
                    <span class="block font-semibold tnum" x-text="new Date(at(d)).getDate()"></span>
                    <span class="block text-[11px] leading-tight" x-text="d < todayIso ? '' : roomAvail(f.id, d) === 0 ? 'penuh' : 'sisa ' + roomAvail(f.id, d)"></span>
                  </button>
                </template>
              </div>
              <div class="mt-3 flex flex-wrap gap-3 text-xs text-ink2">
                <span class="flex items-center gap-1.5"><i class="dot w-2.5 h-2.5" :style="'background:' + bar('Terkonfirmasi')"></i>Tersedia</span>
                <span class="flex items-center gap-1.5"><i class="dot w-2.5 h-2.5" :style="'background:' + bar('Menunggu Pembayaran')"></i>Sisa sedikit</span>
                <span class="flex items-center gap-1.5"><i class="dot w-2.5 h-2.5" :style="'background:' + bar('Ditolak')"></i>Penuh</span>
              </div>
            </div>
          </template>
          <template x-if="f.jenis==='gedung'">
            <div class="mt-3">
              <p class="text-sm text-ink2">Pilih tanggal untuk melihat jam yang sudah terisi.</p>
              <div class="mt-3 flex gap-2 overflow-x-auto pb-2 -mx-4 px-4 lg:mx-0 lg:px-0 snap-x">
                <template x-for="d in range(21).map(k => addDays(todayIso, k))" :key="d">
                  <button type="button" @click="p3.date = d"
                    class="snap-start shrink-0 w-[62px] rounded-xl border py-2 text-center transition-colors"
                    :class="p3.date === d ? 'border-primary bg-psoft/60' : 'border-line bg-white hover:bg-s2'">
                    <span class="block text-[11px] text-ink2" x-text="hari(d)"></span>
                    <span class="block font-semibold tnum" x-text="new Date(at(d)).getDate()"></span>
                    <i class="dot w-2 h-2 mt-1" :style="'background:' + ({kosong: bar('Terkonfirmasi'), sebagian: bar('Menunggu Pembayaran'), penuh: bar('Ditolak')})[dayState(f.id, d)]"></i>
                  </button>
                </template>
              </div>
              <!-- garis waktu jam operasional -->
              <template x-for="a in [db.settings.aturan]"><div class="mt-4">
                <div class="flex justify-between text-[11px] text-ink2 tnum mb-1">
                  <template x-for="t in range((mins(a.tutup) - mins(a.buka)) / 180 + 1)"><span x-text="hhmm(mins(a.buka) + t * 180).replace(':', '.')"></span></template>
                </div>
                <div class="relative h-12 rounded-xl bg-s2/70 border border-line overflow-hidden">
                  <template x-for="x in busy(f.id, p3.date)">
                    <div class="absolute inset-y-1 rounded-lg px-2 flex items-center text-[11px] font-semibold overflow-hidden whitespace-nowrap" :class="x.status==='Agenda Internal' && 'hatch'"
                      :style="`left:${Math.max(0, (mins(x.from) - mins(a.buka)) / (mins(a.tutup) - mins(a.buka)) * 100)}%;width:${(Math.min(mins(x.to), mins(a.tutup)) - Math.max(mins(x.from), mins(a.buka))) / (mins(a.tutup) - mins(a.buka)) * 100}%;background:${bar(x.status)};color:${(STATUS[x.status]||{}).fg}`"
                      x-text="(x.status==='Agenda Internal' ? 'Agenda internal' : 'Terisi') + ' ' + jamLabel(x.from) + '–' + jamLabel(x.to === '24:00' ? a.tutup : x.to)"></div>
                  </template>
                  <div class="absolute inset-y-0 border-2 rounded-lg pointer-events-none"
                    :class="checkItem({fac: f.id, date: p3.date, from: p3.from, to: p3.to}) ? 'border-[#C24141] bg-[#C24141]/10' : 'border-primary bg-primary/10'"
                    :style="`left:${Math.max(0,(mins(p3.from) - mins(a.buka)) / (mins(a.tutup) - mins(a.buka)) * 100)}%;width:${Math.max(0,(mins(p3.to) - mins(p3.from)) / (mins(a.tutup) - mins(a.buka)) * 100)}%`"></div>
                </div>
                <p class="text-xs text-ink2 mt-2">Kotak bergaris adalah jam pilihan Anda. Ada jeda <span x-text="a.jedaMenit"></span> menit antaracara untuk persiapan ruangan.</p>
              </div></template>
            </div>
          </template>
        </div>

        <div><h2 class="font-semibold text-lg">Tarif</h2>
          <div class="mt-3 card overflow-hidden"><table class="tbl"><thead><tr><th>Layanan</th><th>Tarif</th><th>Berlaku mulai</th></tr></thead><tbody>
            <template x-for="t in db.tarif.filter(t => t.fac === f.id)"><tr><td x-text="t.label"></td><td class="tnum font-semibold whitespace-nowrap" x-text="rp(t.nominal) + ' / ' + t.satuan"></td><td class="text-ink2 whitespace-nowrap" x-text="tgl(t.berlaku)"></td></tr></template>
          </tbody></table></div>
          <p class="hint">Dasar: Pergub Kalteng No. 63 Tahun 2024. Tarif terjadwal tahun depan masih contoh.</p></div>

        <div><h2 class="font-semibold text-lg">Aturan pemakaian</h2>
          <ul class="mt-3 space-y-2 text-sm text-ink2 list-disc pl-5">
            <li x-show="f.jenis==='kamar'">Check-in mulai pukul <b x-text="jamLabel(db.settings.aturan.checkin)"></b>, check-out paling lambat <b x-text="jamLabel(db.settings.aturan.checkout)"></b>. Lewat jam check-out dikenai denda <span x-text="rp(db.settings.bayar.dendaJam)"></span>/jam.</li>
            <li x-show="f.jenis==='gedung'">Pemakaian pukul <span x-text="jamLabel(db.settings.aturan.buka) + '–' + jamLabel(db.settings.aturan.tutup)"></span>, wajib diverifikasi admin sebelum tagihan terbit.</li>
            <li>Uang jaminan <span x-text="rp(db.settings.bayar.jaminan)"></span> dibayar saat check-in dan dikembalikan saat check-out.</li>
            <template x-for="s in db.settings.konten.sk.slice(4)"><li x-text="s"></li></template>
          </ul></div>
      </div>

      <!-- form tambah ke pesanan -->
      <aside class="card p-5 lg:sticky lg:top-24">
        <p><span class="text-2xl font-semibold tnum" x-text="rp(f.tarif)"></span><span class="text-ink2" x-text="' / ' + f.satuan"></span></p>
        <template x-if="f.tarifJam"><p class="text-sm text-ink2" x-text="'atau ' + rp(f.tarifJam) + ' per jam (otomatis dipilih yang lebih hemat)'"></p></template>
        <div class="mt-4 grid gap-3">
          <template x-if="f.jenis==='kamar'"><div class="grid gap-3">
            <div class="grid grid-cols-2 gap-3"><label><span class="lbl">Masuk</span><input type="date" class="inp" x-model="p3.start" :min="todayIso"></label><label><span class="lbl">Keluar</span><input type="date" class="inp" x-model="p3.end" :min="p3.start"></label></div>
            <label><span class="lbl">Jumlah kamar</span>
              <div class="flex items-center gap-2"><button type="button" class="btn btn-o w-11 px-0" @click="p3.qty = Math.max(1, p3.qty - 1)" aria-label="Kurangi"><span x-html="ic('minus','w-4 h-4')"></span></button>
                <input type="number" min="1" class="inp text-center tnum" x-model.number="p3.qty"><button type="button" class="btn btn-o w-11 px-0" @click="p3.qty++" aria-label="Tambah"><span x-html="ic('plus','w-4 h-4')"></span></button></div></label>
            <p class="text-sm text-ink2" x-show="p3.end > p3.start"><span x-text="p3.qty + ' kamar × ' + days(p3.start, p3.end) + ' malam'"></span> = <b class="text-ink tnum" x-text="rp(itemAmount({fac: f.id, qty: p3.qty, start: p3.start, end: p3.end}))"></b></p>
          </div></template>
          <template x-if="f.jenis==='gedung'"><div class="grid gap-3">
            <label><span class="lbl">Tanggal</span><input type="date" class="inp" x-model="p3.date" :min="todayIso"></label>
            <div><span class="lbl">Sesi cepat</span><div class="flex flex-wrap gap-2">
              <template x-for="s in db.settings.aturan.sesi"><button type="button" class="btn btn-o btn-sm" :class="p3.from===s.dari && p3.to===s.sampai && 'border-primary bg-psoft/60'" @click="p3.from = s.dari; p3.to = s.sampai" x-text="s.nama"></button></template>
              <button type="button" class="btn btn-o btn-sm" :class="p3.from==='08:00' && p3.to==='16:00' && 'border-primary bg-psoft/60'" @click="p3.from='08:00'; p3.to='16:00'">08.00–16.00</button></div></div>
            <div class="grid grid-cols-2 gap-3"><label><span class="lbl">Mulai</span><input type="time" step="1800" class="inp" x-model="p3.from"></label><label><span class="lbl">Selesai</span><input type="time" step="1800" class="inp" x-model="p3.to"></label></div>
            <p class="text-sm text-ink2" x-show="p3.to > p3.from">Estimasi biaya: <b class="text-ink tnum" x-text="rp(itemAmount({fac: f.id, date: p3.date, from: p3.from, to: p3.to}))"></b></p>
          </div></template>
          <p class="err" x-show="p3.err || checkItem(f.jenis==='kamar' ? {fac:f.id, qty:+p3.qty, start:p3.start, end:p3.end} : {fac:f.id, date:p3.date, from:p3.from, to:p3.to})">
            <span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="checkItem(f.jenis==='kamar' ? {fac:f.id, qty:+p3.qty, start:p3.start, end:p3.end} : {fac:f.id, date:p3.date, from:p3.from, to:p3.to}) || p3.err"></span></p>
          <button class="btn btn-p w-full" @click="addFromP3(f)"><span x-html="ic('plus','w-[18px] h-[18px]')"></span>Tambah ke pesanan</button>
          <p class="text-xs text-ink2 text-center" x-text="f.verifikasi ? 'Belum ada tagihan sampai admin menyetujui jadwal.' : 'Kamar langsung terkonfirmasi bila tersedia.'"></p>
        </div>
      </aside>
    </div>
  </section>
  </template>

  <!-- P4 FORM PEMESANAN -->
  <template x-if="route==='p4'">
  <section class="max-w-6xl mx-auto px-4 py-6 md:py-10">
    <h1 class="h-display text-3xl md:text-4xl">Form pemesanan</h1>
    <div class="mt-6" x-html="document.getElementById('tpl-wizard').innerHTML"></div>
  </section>
  </template>

  <!-- P5 PESANAN TERKIRIM -->
  <template x-for="b in (route==='p5' && bk(param) ? [bk(param)] : [])" :key="b.kode">
  <section class="max-w-2xl mx-auto px-4 py-10 md:py-16 text-center">
    <span class="mx-auto w-14 h-14 rounded-full grid place-items-center" :class="b.status==='Menunggu Verifikasi' ? 'bg-[#ECE8F6] text-[#5B4B8A]' : 'bg-asoft text-accent'" x-html="ic(b.status==='Menunggu Verifikasi' ? 'clock' : 'check','w-7 h-7')"></span>
    <h1 class="h-display text-3xl mt-5" x-text="b.status==='Menunggu Verifikasi' ? 'Pengajuan terkirim' : 'Pesanan dibuat, kamar ditahan'"></h1>
    <p class="text-ink2 mt-2">Simpan kode booking ini. Kode juga dikirim ke WhatsApp <b x-text="b.hp"></b><span x-show="b.email"> dan email</span>.</p>
    <div class="mt-6 inline-flex items-center gap-3 rounded-2xl border-2 border-dashed border-primary/40 bg-white px-6 py-4">
      <span class="text-2xl md:text-3xl font-bold tracking-wider tnum" x-text="b.kode"></span>
      <button class="btn btn-o btn-sm" @click="copy(b.kode)"><span x-html="ic('copy','w-4 h-4')"></span>Salin</button>
    </div>
    <template x-if="b.status==='Menunggu Pembayaran' || b.status==='Kedaluwarsa'">
      <div class="card p-6 mt-8 text-left">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div><p class="text-sm text-ink2">Selesaikan pembayaran dalam</p><p class="text-4xl font-semibold tnum mt-1" :class="b.holdUntil - now < 30*60e3 ? 'text-[#9B2C2C]' : ''" x-text="b.status==='Kedaluwarsa' ? 'Kedaluwarsa' : countdown(b.holdUntil)"></p></div>
          <div class="text-right"><p class="text-sm text-ink2">Total tagihan</p><p class="text-2xl font-semibold tnum" x-text="rp(total(b))"></p>
            <p class="text-sm text-ink2" x-show="b.bayarPilihan==='dp'">DP <span x-text="db.settings.bayar.dpPersen"></span>%: <b class="tnum text-ink" x-text="rp(dpAmount(b))"></b></p></div>
        </div>
        <div class="mt-5 rounded-xl bg-bg p-4 text-sm grid gap-1">
          <p class="text-ink2">Transfer ke rekening resmi</p>
          <p class="font-semibold text-base" x-text="db.settings.bayar.bank + ' · ' + db.settings.bayar.noRek"></p><p x-text="'a.n. ' + db.settings.bayar.atasNama"></p>
          <p class="text-xs text-ink2">Nomor rekening contoh, menunggu data resmi.</p>
        </div>
        <a :href="'#/p7/' + b.kode" class="btn btn-p w-full mt-5"><span x-html="ic('upload','w-[18px] h-[18px]')"></span>Unggah bukti bayar</a>
      </div>
    </template>
    <template x-if="b.status==='Menunggu Verifikasi'">
      <div class="card p-6 mt-8 text-left">
        <p class="font-semibold">Menunggu verifikasi admin</p>
        <p class="text-sm text-ink2 mt-1">Admin memeriksa jadwal dan keperluan pemakaian gedung, biasanya dalam jam kerja yang sama (maksimal <span x-text="db.settings.aturan.holdGedungJam"></span> jam). Jadwal Anda sudah ditahan selama proses ini.</p>
        <ol class="mt-4 space-y-2 text-sm">
          <li class="flex gap-3"><span class="text-accent" x-html="ic('check','w-5 h-5')"></span>Pengajuan diterima</li>
          <li class="flex gap-3"><span class="text-[#5B4B8A]" x-html="ic('clock','w-5 h-5')"></span>Verifikasi admin</li>
          <li class="flex gap-3 text-ink2"><span x-html="ic('wallet','w-5 h-5')"></span>Tagihan terbit, bayar DP atau lunas</li>
        </ol>
        <a :href="'#/p7/' + b.kode" class="btn btn-o w-full mt-5">Lihat detail booking</a>
      </div>
    </template>
  </section>
  </template>

  <!-- P6 LACAK -->
  <template x-if="route==='p6'">
  <section class="max-w-md mx-auto px-4 py-12 md:py-20">
    <h1 class="h-display text-3xl text-center">Lacak booking</h1>
    <p class="text-ink2 text-center mt-2">Masukkan kode booking dan nomor HP yang dipakai saat memesan.</p>

      <p class="err" x-show="track.err"><span x-html="ic('alert','w-4 h-4 shrink-0 mt-0.5')"></span><span x-text="track.err"></span></p>
      <button class="btn btn-p w-full">Lihat booking</button>

        <template x-for="b in sortedBookings().slice(0, 8)" :key="b.kode">
          <button class="badge cursor-pointer" :style="st(b.status)" @click="track.kode = b.kode; track.hp = b.hp"><i class="dot" :style="dot(b.status)"></i><span x-text="b.kode"></span></button>
        </template>
      </div>

  <!-- P7 DETAIL BOOKING PENYEWA -->
  <template x-for="b in (route==='p7' && bk(param) ? [bk(param)] : [])" :key="b.kode">

  </template>

  <!-- P8 INFO -->
  <template x-if="route==='p8'">
  <section class="max-w-4xl mx-auto px-4 py-8 md:py-12">
    <h1 class="h-display text-3xl md:text-4xl">Informasi</h1>
    <div class="mt-6 flex gap-2 overflow-x-auto pb-1" role="tablist">
      <template x-for="t in [['sk','Syarat & Ketentuan'],['refund','Pembatalan & Refund'],['faq','Tanya Jawab'],['kontak','Kontak']]">
        <button class="btn btn-sm shrink-0" :class="p8tab===t[0] ? 'btn-p' : 'btn-o'" @click="p8tab=t[0]" x-text="t[1]" role="tab" :aria-selected="p8tab===t[0]"></button>

      <ol x-show="p8tab==='sk'" class="space-y-4 list-decimal pl-5 max-w-[68ch]"><template x-for="s in db.settings.konten.sk"><li x-text="s"></li></template></ol>

        <template x-for="j in ['kamar','gedung']">
          <div class="card overflow-hidden"><p class="px-4 pt-4 font-semibold" x-text="j==='kamar' ? 'Kamar asrama' : 'Gedung & ruangan'"></p>
            <table class="tbl mt-2"><thead><tr><th>Dibatalkan</th><th>Dana kembali</th></tr></thead><tbody>
              <template x-for="r in db.settings.refund[j]"><tr><td x-text="r.h > 0 ? 'Paling lambat H-' + r.h : 'Kurang dari itu / hari-H'"></td><td class="font-semibold tnum" x-text="r.p + '% dari yang sudah dibayar'"></td></tr></template>
            </tbody></table></div>
        </template>
        <p class="md:col-span-2 text-sm text-ink2">Reschedule gratis <span x-text="db.settings.refund.reschedMaks"></span> kali bila diajukan paling lambat H-<span x-text="db.settings.refund.reschedMinH"></span> dan jadwal baru tersedia. Aturan ini masih usulan dan menunggu keputusan pengelola.</p>
      </div>
      <div x-show="p8tab==='faq'" class="divide-y divide-line border-y border-line">
        <template x-for="f in db.settings.konten.faq"><details class="group py-4"><summary class="flex justify-between items-center cursor-pointer font-semibold list-none"><span x-text="f.q"></span><span class="transition-transform group-open:rotate-180 text-ink2" x-html="ic('chevronDown','w-5 h-5')"></span></summary><p class="mt-2 text-ink2" x-text="f.a"></p></details></template>
      </div>
      <div x-show="p8tab==='kontak'" class="grid md:grid-cols-2 gap-5">
        <div class="space-y-4">
          <p class="font-semibold" x-text="db.settings.profil.nama"></p>

            <div class="mt-3 space-y-2"><template x-for="(s, k) in db.settings.konten.sk" :key="k"><div class="flex gap-2"><span class="w-6 pt-2 text-sm text-ink2 tnum" x-text="k + 1 + '.'"></span><textarea class="inp text-sm min-h-[60px]" x-model="db.settings.konten.sk[k]"></textarea></div></template>

              <button class="btn btn-o btn-sm" @click="db.settings.konten.faq.push({q: 'Pertanyaan baru', a: ''})"><span x-html="ic('plus','w-4 h-4')"></span>Tambah pertanyaan</button></div></div>
        </div>
        <div class="mt-8 pt-5 border-t border-line flex items-center gap-3"><button class="btn btn-p" @click="toast('Pengaturan disimpan dan langsung berlaku')">Simpan pengaturan</button><p class="text-xs text-ink2">Perubahan langsung dipakai di seluruh prototype (mis. hold, DP, aturan refund, S&K).</p></div>
      </div>
    </div>
    </template>
  </main>
</div>
</template>

<!-- ===================== MODAL ===================== -->
<div x-show="modal" x-transition.opacity.duration.150ms class="fixed inset-0 z-[60] bg-ink/40 flex items-end sm:items-center justify-center sm:p-4" @click.self="close()" @keydown.escape.window="close()">
  <div class="bg-white w-full rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto shadow-[0_20px_60px_rgba(40,30,10,.25)]" :class="modal === 'doc' ? 'sm:max-w-3xl' : 'sm:max-w-lg'" role="dialog" aria-modal="true">

    <!-- unggah bukti bayar -->
    <template x-for="b in (modal === 'upload' ? [bk(m.kode)] : [])" :key="b.kode">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Unggah bukti bayar</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <div><span class="lbl">Jenis pembayaran</span><div class="seg">
          <template x-for="j in (paid(b) === 0 ? ['DP', 'Lunas'] : (b.status === 'Berlangsung' ? ['Tambahan'] : ['Pelunasan']))"><button type="button" :class="m.jenis === j && 'on'" @click="setUploadJenis(b, j)" x-text="j"></button></template></div></div>
        <label class="block"><span class="lbl">Nominal ditransfer</span><input type="number" class="inp tnum" x-model.number="m.nominal"><span class="hint block" x-text="'Tagihan: ' + (m.jenis === 'DP' ? 'DP ' + rp(dpAmount(b)) : 'sisa ' + rp(sisa(b)))"></span></label>
        <div><span class="lbl">File bukti transfer</span>
          <label class="flex flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-line p-6 text-center cursor-pointer hover:bg-bg transition-colors">
            <span class="text-ink2" x-html="ic('upload','w-7 h-7')"></span>
            <span class="text-sm" x-text="m.file || 'Ketuk untuk memilih foto atau PDF'"></span>
            <input type="file" accept="image/*,.pdf" class="sr-only" @change="m.file = ($event.target.files[0] || {}).name || ''"></label>
          <button type="button" class="text-xs font-semibold text-primary mt-2" @click="m.file = 'bukti-transfer-' + b.kode + '.jpg'">Pakai file contoh (demo)</button></div>
        <p class="err" x-show="m.err"><span x-text="m.err"></span></p>
        <button class="btn btn-p w-full" @click="submitUpload()">Kirim bukti</button>
      </div>
    </template>

    <!-- perpanjang -->
    <template x-for="b in (modal === 'extend' ? [bk(m.kode)] : [])" :key="b.kode">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Perpanjang</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Item</span><select class="inp" x-model.number="m.item"><template x-for="(it, k) in b.items" :key="k"><option :value="k" :selected="m.item === k" x-text="fac(it.fac).nama + (isKamar(it) ? ' (' + it.qty + ' kamar, s.d. ' + tgl(it.end) + ')' : ' (' + jamLabel(it.from) + '–' + jamLabel(it.to) + ')')"></option></template></select></label>
        <label class="block"><span class="lbl" x-text="'Tambah berapa ' + (isKamar(b.items[m.item]) ? 'malam' : 'jam')"></span>
          <div class="flex items-center gap-2"><button type="button" class="btn btn-o w-11 px-0" @click="m.tambah = Math.max(1, m.tambah - 1)" aria-label="Kurangi"><span x-html="ic('minus','w-4 h-4')"></span></button><input type="number" min="1" class="inp text-center tnum w-24" x-model.number="m.tambah"><button type="button" class="btn btn-o w-11 px-0" @click="m.tambah++" aria-label="Tambah"><span x-html="ic('plus','w-4 h-4')"></span></button></div></label>
        <div class="rounded-xl p-4 text-sm" :style="extendCheck().ok ? st('Terkonfirmasi') : st('Ditolak')">
          <p class="font-semibold flex items-center gap-2"><span x-html="ic(extendCheck().ok ? 'check' : 'alert','w-4 h-4')"></span><span x-text="extendCheck().ok ? 'Tersedia' : 'Tidak bisa diperpanjang'"></span></p>
          <p class="mt-1" x-text="extendCheck().msg"></p>
          <p x-show="extendCheck().ok" class="mt-2 font-semibold tnum" x-text="'Tagihan tambahan ' + rp(extendCheck().biaya)"></p></div>
        <button class="btn btn-p w-full" :disabled="!extendCheck().ok" @click="submitExtend()" x-text="extendCheck().gedung && role === 'pengunjung' ? 'Ajukan ke admin' : 'Perpanjang sekarang'"></button>
      </div>
    </template>

    <!-- reschedule -->
    <template x-for="b in (modal === 'resched' ? [bk(m.kode)] : [])" :key="b.kode">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg" x-text="role === 'pengunjung' ? 'Ajukan reschedule' : 'Pindah jadwal'"></h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <p class="text-sm text-ink2" x-text="'Jadwal sekarang mulai ' + tglPanjang(firstDate(b)) + '. Semua item ikut bergeser dengan selisih hari yang sama.'"></p>
        <label class="block"><span class="lbl">Tanggal mulai baru</span><input type="date" class="inp" x-model="m.baru" :min="todayIso"></label>
        <ul class="text-sm space-y-1"><template x-for="(it, k) in shifted(b, m.baru)" :key="k"><li class="flex gap-2"><span class="text-ink2" x-html="ic('calendar','w-4 h-4 mt-0.5')"></span><span><b x-text="fac(it.fac).singkat"></b> · <span x-text="itemDesc(it)"></span></span></li></template></ul>
        <div class="rounded-xl p-3 text-sm" :style="checkResched(b) ? st('Ditolak') : st('Terkonfirmasi')" x-text="checkResched(b) || 'Jadwal baru tersedia.'"></div>
        <button class="btn btn-p w-full" :disabled="!!checkResched(b)" @click="submitResched()" x-text="role === 'pengunjung' ? 'Kirim pengajuan' : 'Pindahkan jadwal'"></button>
      </div>
    </template>

    <!-- batalkan -->
    <template x-for="b in (modal === 'cancel' ? [bk(m.kode)] : [])" :key="b.kode">
      <div class="p-5 md:p-6 space-y-4" x-data="{ get c() { return this.refundCalc(this.b) } }">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Batalkan booking</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <p class="text-sm text-ink2" x-text="'Pembatalan dilakukan H-' + c.h + ' dari tanggal pemakaian. Perhitungan mengikuti kebijakan pembatalan.'"></p>
        <div class="rounded-xl border border-line overflow-hidden"><table class="tbl"><thead><tr><th>Item</th><th class="text-right">Dibayar</th><th class="text-right">Kembali</th></tr></thead><tbody>
          <template x-for="(r, k) in c.rows" :key="k"><tr><td x-text="r.label"></td><td class="text-right tnum" x-text="rp(r.dibayar)"></td><td class="text-right tnum" x-text="r.persen + '% · ' + rp(r.refund)"></td></tr></template>
        </tbody></table>
          <div class="px-4 py-3 bg-s2/50 flex justify-between font-semibold"><span>Dana dikembalikan</span><span class="tnum" x-text="rp(c.total)"></span></div></div>
        <p x-show="c.paid === 0" class="text-sm text-ink2">Belum ada pembayaran, jadi tidak ada dana yang dikembalikan.</p>
        <label class="block"><span class="lbl">Alasan pembatalan (opsional)</span><textarea class="inp" x-model="m.alasan"></textarea></label>
        <div class="grid grid-cols-2 gap-2"><button class="btn btn-o" @click="close()">Tidak jadi</button><button class="btn btn-d" @click="doCancel(b, m.alasan)">Ya, batalkan</button></div>
      </div>
    </template>

    <!-- tolak / revisi -->
    <template x-for="b in (['tolak','revisi'].includes(modal) ? [bk(m.kode)] : [])" :key="b.kode">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg" x-text="(modal === 'tolak' ? 'Tolak pengajuan ' : 'Minta revisi ') + b.kode"></h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <template x-if="modal === 'tolak'"><label class="block"><span class="lbl">Alasan penolakan</span><textarea class="inp" x-model="m.alasan" placeholder="Dikirim ke penyewa lewat WhatsApp/email"></textarea><span class="hint block">Jadwal yang ditahan langsung dilepas.</span></label></template>
        <template x-if="modal === 'revisi'"><label class="block"><span class="lbl">Apa yang perlu diperbaiki?</span><textarea class="inp" x-model="m.note" placeholder="Contoh: lengkapi jumlah peserta dan susunan acara"></textarea><span class="hint block">Jadwal tetap ditahan 24 jam sambil menunggu revisi.</span></label></template>
        <div class="grid grid-cols-2 gap-2"><button class="btn btn-o" @click="close()">Batal</button>
          <button class="btn" :class="modal === 'tolak' ? 'btn-d' : 'btn-p'" @click="modal === 'tolak' ? reject(b, m.alasan) : askRevision(b, m.note)" x-text="modal === 'tolak' ? 'Tolak' : 'Kirim permintaan'"></button></div>
      </div>
    </template>

    <!-- dokumen invoice / kuitansi -->
    <template x-for="b in (modal === 'doc' ? [bk(m.kode)] : [])" :key="b.kode + m.jenis">
      <div class="p-4 md:p-6">
        <div class="flex justify-between gap-3 mb-4"><p class="font-semibold" x-text="m.jenis === 'invoice' ? 'Invoice' : 'Kuitansi'"></p>
          <div class="flex gap-2"><button class="btn btn-o btn-sm" @click="toast('Prototype: PDF dibuat di sistem final', 'download', 'info')"><span x-html="ic('download','w-4 h-4')"></span>Unduh PDF</button><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div></div>
        <div class="border border-line rounded-xl p-5 md:p-8 bg-white text-[13px] relative overflow-hidden">
          <svg class="absolute right-4 top-4 h-40 text-primary/10" aria-hidden="true"><use href="#garing"/></svg>
          <div class="flex items-center gap-4 border-b-2 border-ink pb-3">
            <img src="assets/logo-dinkes.png" alt="" class="h-14 w-14 object-contain" @error="$el.style.visibility = 'hidden'">
            <div class="flex-1 text-center leading-tight"><p class="font-semibold" x-text="db.settings.dokumen.kop1"></p><p class="font-semibold" x-text="db.settings.dokumen.kop2"></p><p class="font-bold text-[15px]" x-text="db.settings.dokumen.kop3"></p><p class="text-[11px] text-ink2" x-text="db.settings.profil.alamat + ' · ' + db.settings.profil.telp"></p></div>
            <img src="assets/logo-bapelkes.png" alt="" class="h-14 w-14 object-contain" @error="$el.style.visibility = 'hidden'">
          </div>
          <template x-if="m.jenis === 'invoice'"><div>
            <div class="mt-5 flex flex-wrap justify-between gap-4"><div><p class="text-lg font-bold tracking-wide">INVOICE</p><p class="tnum" x-text="'No. ' + docNo(db.settings.dokumen.fmtInv, b)"></p><p x-text="'Tanggal ' + tgl(b.dibuat)"></p></div>
              <div class="text-right"><p class="text-ink2">Kepada</p><p class="font-semibold" x-text="b.nama"></p><p x-text="b.instansi || 'Perorangan'"></p><p class="tnum" x-text="'Kode booking ' + b.kode"></p></div></div>
            <table class="w-full mt-5 border-collapse"><thead><tr class="border-y border-ink/60"><th class="text-left py-2">Uraian</th><th class="text-right py-2">Jumlah</th></tr></thead><tbody>
              <template x-for="(l, k) in lines(b)" :key="k"><tr class="border-b border-line"><td class="py-2"><p class="font-medium" x-text="l.label"></p><p class="text-ink2 text-[12px]" x-text="l.desc"></p></td><td class="text-right tnum py-2" x-text="rp(l.amount)"></td></tr></template>
            </tbody></table>
            <div class="mt-3 ml-auto max-w-[260px] space-y-1"><p class="flex justify-between font-semibold"><span>Total</span><span class="tnum" x-text="rp(total(b))"></span></p><p class="flex justify-between"><span>Dibayar</span><span class="tnum" x-text="rp(paid(b))"></span></p><p class="flex justify-between font-bold border-t border-ink/60 pt-1"><span>Sisa</span><span class="tnum" x-text="rp(sisa(b))"></span></p></div>
            <p class="mt-5 text-ink2" x-text="'Pembayaran ke ' + db.settings.bayar.bank + ' ' + db.settings.bayar.noRek + ' a.n. ' + db.settings.bayar.atasNama + '. Cantumkan kode booking pada berita transfer.'"></p>
          </div></template>
          <template x-for="p in (m.jenis === 'kuitansi' ? b.payments.filter(p => p.id === m.pid) : [])" :key="p.id"><div>
            <div class="mt-5 text-center"><p class="text-lg font-bold tracking-[0.3em]">KUITANSI</p><p class="tnum" x-text="'No. ' + p.kuitansi"></p></div>
            <dl class="mt-5 grid grid-cols-[140px_1fr] gap-y-2">
              <dt class="text-ink2">Telah terima dari</dt><dd class="font-semibold" x-text="b.nama + (b.instansi ? ' (' + b.instansi + ')' : '')"></dd>
              <dt class="text-ink2">Uang sejumlah</dt><dd class="font-bold text-base tnum" x-text="rp(p.nominal)"></dd>
              <dt class="text-ink2">Untuk pembayaran</dt><dd x-text="p.jenis + ' sewa ' + ringkas(b) + ' · kode ' + b.kode"></dd>
              <dt class="text-ink2">Metode</dt><dd x-text="p.metode || 'Transfer'"></dd>
            </dl>
          </div></template>
          <div class="mt-8 flex justify-end"><div class="text-center w-56"><p x-text="'Palangka Raya, ' + tgl(m.jenis === 'kuitansi' ? (b.payments.find(p => p.id === m.pid) || {}).tgl : b.dibuat, {day:'numeric', month:'long', year:'numeric'})"></p><p x-text="db.settings.dokumen.ttdJabatan"></p><div class="h-16"></div><p class="font-semibold underline" x-text="db.settings.dokumen.ttdNama"></p></div></div>
        </div>
        <p class="text-xs text-ink2 mt-3">Pratinjau. Format, materai, dan penanda tangan menunggu konfirmasi pengelola.</p>
      </div>
    </template>

    <!-- slot gedung (kalender) -->
    <template x-if="modal === 'slot'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><div><h2 class="font-semibold text-lg" x-text="fac(m.fac).nama"></h2><p class="text-sm text-ink2" x-text="tglPanjang(m.d)"></p></div><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <ul class="space-y-2"><template x-for="x in busy(m.fac, m.d)"><li class="rounded-xl p-3 text-sm" :style="st(x.status)"><b x-text="x.kode || 'Agenda internal'"></b> · <span x-text="jamLabel(x.from) + '–' + jamLabel(x.to)"></span><span class="block" x-text="x.label"></span></li></template></ul>
        <p x-show="!busy(m.fac, m.d).length" class="text-sm text-ink2">Belum ada jadwal pada tanggal ini.</p>
        <div class="grid sm:grid-cols-2 gap-2"><button class="btn btn-o" @click="openBlock(m.fac, m.d)"><span x-html="ic('lock','w-4 h-4')"></span>Blokir agenda internal</button><button class="btn btn-p" @click="offlineFrom(m.fac, m.d)"><span x-html="ic('phone','w-4 h-4')"></span>Booking offline</button></div>
      </div>
    </template>

    <!-- sel kamar (kalender) -->
    <template x-if="modal === 'cell'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><div><h2 class="font-semibold text-lg" x-text="fac(m.fac).nama"></h2><p class="text-sm text-ink2" x-text="'Malam ' + tglPanjang(m.d) + ' · sisa ' + roomAvail(m.fac, m.d) + ' dari ' + unitsOf(m.fac) + ' kamar siap pakai'"></p></div><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <ul class="divide-y divide-line border-y border-line">
          <template x-for="b in db.bookings.filter(b => HOLDING.includes(b.status) && b.items.some(i => i.fac === m.fac && i.start <= m.d && m.d < i.end))" :key="b.kode">
            <li><a :href="'#/a4/' + b.kode" @click="close()" class="py-2.5 flex items-center gap-3 text-sm hover:bg-bg"><b class="tnum" x-text="b.kode"></b><span class="flex-1 truncate" x-text="b.nama"></span><span class="tnum" x-text="b.items.filter(i => i.fac === m.fac).reduce((s, i) => s + i.qty, 0) + ' kmr'"></span><span class="badge" :style="st(b.status)" x-text="b.status"></span></a></li>
          </template>
          <template x-for="k in db.blocks.filter(k => k.fac === m.fac && k.start <= m.d && m.d < k.end)" :key="k.id">
            <li class="py-2.5 flex items-center gap-3 text-sm"><span class="w-3 h-3 rounded hatch" :style="'background-color:' + bar('Agenda Internal')"></span><span class="flex-1" x-text="k.label"></span><span class="tnum" x-text="k.qty + ' kmr'"></span><button x-show="rw('a2')" class="text-xs text-[#9B2C2C] font-semibold" @click="removeBlock(k.id)">Hapus</button></li>
          </template>
        </ul>
        <div x-show="rw('a2')" class="grid sm:grid-cols-2 gap-2"><button class="btn btn-o" @click="openBlock(m.fac, m.d)"><span x-html="ic('lock','w-4 h-4')"></span>Blokir agenda internal</button><button class="btn btn-p" @click="offlineFrom(m.fac, m.d)"><span x-html="ic('phone','w-4 h-4')"></span>Booking offline</button></div>
      </div>
    </template>

    <!-- blokir agenda internal -->
    <template x-if="modal === 'block'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Blokir agenda internal</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Fasilitas</span><select class="inp" x-model="m.fac"><template x-for="f in db.facilities"><option :value="f.id" :selected="m.fac === f.id" x-text="f.nama"></option></template></select></label>

        <button class="btn btn-p w-full" @click="saveBlock()">Blokir jadwal</button>
      </div>
    </template>

    <!-- info blokir -->
    <template x-for="k in (modal === 'blockinfo' ? db.blocks.filter(k => k.id === m.id) : [])" :key="k.id">
      <div class="p-5 md:p-6 space-y-3">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Agenda internal</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <p class="font-semibold" x-text="k.label"></p><p class="text-sm text-ink2" x-text="fac(k.fac).nama + ' · ' + tgl(k.start) + ' – ' + tgl(addDays(k.end, -1))"></p>
        <button x-show="rw('a2')" class="btn btn-d w-full" @click="removeBlock(k.id)"><span x-html="ic('trash','w-4 h-4')"></span>Hapus blokir</button>
      </div>
    </template>

    <!-- status kamar -->
    <template x-for="r in (modal === 'room' ? db.rooms.filter(r => r.no === m.no) : [])" :key="r.no">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><div><h2 class="font-semibold text-lg" x-text="'Kamar ' + r.no"></h2><p class="text-sm text-ink2" x-text="fac(r.fac).nama + ' · lantai ' + r.lantai"></p></div><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <template x-if="roomBooking(r.no)"><a :href="'#/a4/' + roomBooking(r.no).kode" @click="close()" class="block rounded-xl p-3 text-sm" :style="st('Berlangsung')"><b x-text="roomBooking(r.no).kode"></b> · <span x-text="roomBooking(r.no).nama"></span><span class="block" x-text="'Check-out ' + waktu(checkoutDue(roomBooking(r.no)))"></span></a></template>
        <div class="grid grid-cols-2 gap-2">
          <template x-for="(v, s) in ROOM_STATUS"><label class="rounded-xl border-2 p-3 flex items-center gap-2 cursor-pointer" :class="m.status === s ? '' : 'border-transparent'" :style="rs(s) + (m.status === s ? ';border-color:' + v.fg : '')">
            <input type="radio" class="sr-only" :value="s" x-model="m.status" :disabled="!rw('a14')"><span x-html="ic({siap: 'check', terisi: 'bed', kotor: 'broom', perbaikan: 'wrench'}[s],'w-4 h-4')"></span><span class="font-semibold text-sm" x-text="v.label"></span></label></template>
        </div>
        <label class="block"><span class="lbl">Catatan</span><textarea class="inp" x-model="m.catatan" :disabled="!rw('a14')" placeholder="Contoh: kran bocor, sudah lapor teknisi"></textarea></label>
        <button x-show="rw('a14')" class="btn btn-p w-full" @click="setRoom(r, m.status, m.catatan)">Simpan status</button>
      </div>
    </template>

    <!-- fasilitas -->
    <template x-if="modal === 'facility'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg" x-text="m.baru ? 'Tambah fasilitas' : 'Ubah fasilitas'"></h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Nama</span><input class="inp" x-model="m.nama"></label>
        <div class="grid grid-cols-2 gap-3">
          <label><span class="lbl">Jenis</span><select class="inp" x-model="m.jenis" :disabled="!m.baru"><option value="kamar">Kamar</option><option value="gedung">Gedung/ruangan</option></select></label>
          <label><span class="lbl">Kapasitas (orang)</span><input type="number" class="inp tnum" x-model.number="m.kapasitas"></label>
          <label><span class="lbl">Tarif (Rp)</span><input type="number" class="inp tnum" x-model.number="m.tarif"></label>
          <label><span class="lbl">Satuan</span><select class="inp" x-model="m.satuan"><option>malam</option><option>hari</option><option>sesi</option><option>jam</option></select></label>
          <label x-show="m.jenis === 'gedung'"><span class="lbl">Tarif per jam (opsional)</span><input type="number" class="inp tnum" x-model="m.tarifJam"></label>
          <label><span class="lbl">Lokasi</span><input class="inp" x-model="m.lokasi"></label>
        </div>
        <label class="block"><span class="lbl">Deskripsi</span><textarea class="inp" x-model="m.deskripsi"></textarea></label>
        <label class="block"><span class="lbl">Fasilitas (pisahkan dengan koma)</span><input class="inp" x-model="m.fasilitasTxt"></label>
        <div><span class="lbl">Foto</span><button class="btn btn-o btn-sm" @click="toast('Prototype: unggah foto tersedia di sistem final', 'upload', 'info')"><span x-html="ic('upload','w-4 h-4')"></span>Unggah foto</button></div>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" class="w-4 h-4 accent-[rgb(var(--primary))]" x-model="m.verifikasi"><span>Perlu verifikasi admin sebelum tagihan terbit</span></label>
        <p class="err" x-show="m.err"><span x-text="m.err"></span></p>
        <button class="btn btn-p w-full" @click="saveFacility()">Simpan</button>
      </div>
    </template>

    <!-- tarif -->
    <template x-if="modal === 'tarif'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg">Tambah tarif</h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Fasilitas</span><select class="inp" x-model="m.fac"><template x-for="f in db.facilities"><option :value="f.id" :selected="m.fac === f.id" x-text="f.nama"></option></template></select></label>
        <div class="grid grid-cols-2 gap-3"><label><span class="lbl">Tarif (Rp)</span><input type="number" class="inp tnum" x-model.number="m.nominal"></label><label><span class="lbl">Satuan</span><select class="inp" x-model="m.satuan"><option>malam</option><option>hari</option><option>sesi</option><option>jam</option></select></label></div>
        <label class="block"><span class="lbl">Berlaku mulai</span><input type="date" class="inp" x-model="m.berlaku"></label>
        <label class="block"><span class="lbl">Dasar hukum</span><input class="inp" x-model="m.dasar" placeholder="Contoh: Pergub Kalteng No. ... Tahun ..."></label>
        <p class="err" x-show="m.err"><span x-text="m.err"></span></p>
        <button class="btn btn-p w-full" @click="saveTarif()">Simpan tarif</button>
      </div>
    </template>

    <!-- layanan tambahan -->
    <template x-if="modal === 'addon'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg" x-text="m.id ? 'Ubah layanan' : 'Tambah layanan'"></h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Nama</span><input class="inp" x-model="m.nama"></label>
        <div class="grid grid-cols-3 gap-3"><label><span class="lbl">Tarif (Rp)</span><input type="number" class="inp tnum" x-model.number="m.tarif"></label><label><span class="lbl">Satuan</span><input class="inp" x-model="m.satuan"></label><label><span class="lbl">Stok</span><input type="number" class="inp tnum" x-model="m.stok" placeholder="–"></label></div>
        <label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" class="w-4 h-4 accent-[rgb(var(--primary))]" x-model="m.aktif"><span>Tampilkan di form pemesanan</span></label>
        <p class="err" x-show="m.err"><span x-text="m.err"></span></p>
        <button class="btn btn-p w-full" @click="saveAddon()">Simpan</button>
      </div>
    </template>

    <!-- pengguna -->
    <template x-if="modal === 'user'">
      <div class="p-5 md:p-6 space-y-4">
        <div class="flex justify-between gap-3"><h2 class="font-semibold text-lg" x-text="m.id ? 'Ubah pengguna' : 'Tambah pengguna'"></h2><button class="btn btn-g w-9 h-9 px-0" @click="close()" aria-label="Tutup"><span x-html="ic('x')"></span></button></div>
        <label class="block"><span class="lbl">Nama</span><input class="inp" x-model="m.nama"></label>
        <label class="block"><span class="lbl">Email</span><input type="email" class="inp" x-model="m.email"></label>
        <div><span class="lbl">Peran</span><div class="seg"><template x-for="r in ['admin','bendahara','kepala']"><button type="button" :class="m.peran === r && 'on'" @click="m.peran = r" x-text="roleName(r)"></button></template></div></div>
        <p class="err" x-show="m.err"><span x-text="m.err"></span></p>
        <button class="btn btn-p w-full" @click="saveUser()">Simpan</button>
      </div>
    </template>
  </div>
</div>

<!-- ===================== TOAST ===================== -->
<div class="fixed top-3 inset-x-3 sm:inset-x-auto sm:right-4 sm:top-4 z-[70] flex flex-col gap-2 sm:w-[380px] pointer-events-none" aria-live="polite">
  <template x-for="t in toasts.slice(-3)" :key="t.id">
    <div x-transition:enter="transition duration-200 ease-out" x-transition:enter-start="opacity-0 -translate-y-2" class="pointer-events-auto rounded-xl bg-ink text-white px-4 py-3 shadow-lg flex gap-3 items-start text-sm">
      <span class="shrink-0 mt-0.5" :class="{ok: 'text-[#9FD7B0]', info: 'text-[#B9CBF0]', warn: 'text-[#F2C27E]'}[t.tone]" x-html="ic(t.icon,'w-[18px] h-[18px]')"></span><span x-text="t.text"></span>
    </div>
  </template>
</div>
